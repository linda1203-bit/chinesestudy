<script>

/* =========================================================
GLOBAL VARIABLES
========================================================= */

let globalDatabase =
JSON.parse(
    localStorage.getItem("zh_master_db")
) || [];

let activeSkillMode = "";

let currentWords = [];

let activeIdx = 0;

let currentActiveTopicName = "";

let puzzleSelectedChips = [];

let currentActiveSentenceTarget = "";

let testIdx = 0;

let testScore = 0;

/* =========================================================
SAFE DOM
========================================================= */

function safeText(id,val){

    const el =
    document.getElementById(id);

    if(el){

        el.innerText = val;
    }
}

function safeHTML(id,val){

    const el =
    document.getElementById(id);

    if(el){

        el.innerHTML = val;
    }
}

/* =========================================================
SPEECH ENGINE
========================================================= */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

let voiceRecognitionEngine = null;

if(SpeechRecognition){

    voiceRecognitionEngine =
    new SpeechRecognition();

    voiceRecognitionEngine.lang =
    "zh-CN";

    voiceRecognitionEngine.continuous =
    false;

    voiceRecognitionEngine.interimResults =
    false;
}

/* =========================================================
UPLOAD PARSER
========================================================= */

function triggerUploadParser(input){

    const file = input.files[0];

    if(!file) return;

    safeText(
        "status-msg",
        "🔄 Đang xử lý file..."
    );

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        /* DOCX */

        if(
            file.name
            .toLowerCase()
            .endsWith(".docx")
        ){

            mammoth.extractRawText({

                arrayBuffer:
                e.target.result

            })

            .then(result=>{

                executeTextParserEngine(
                    result.value
                );
            });

            return;
        }

        /* PDF */

        if(
            file.name
            .toLowerCase()
            .endsWith(".pdf")
        ){

            pdfjsLib
            .getDocument({

                data:
                new Uint8Array(
                    e.target.result
                )

            })

            .promise

            .then(async pdf=>{

                let fullText = "";

                for(
                    let i=1;
                    i<=pdf.numPages;
                    i++
                ){

                    const page =
                    await pdf.getPage(i);

                    const content =
                    await page.getTextContent();

                    const text =
                    content.items
                    .map(x=>x.str)
                    .join(" ");

                    fullText +=
                    text + "\n";
                }

                executeTextParserEngine(
                    fullText
                );
            });

            return;
        }

        /* TXT */

        executeTextParserEngine(
            e.target.result
        );
    };

    if(
        file.name
        .toLowerCase()
        .endsWith(".txt")
    ){

        reader.readAsText(file);

    }else{

        reader.readAsArrayBuffer(file);
    }
}

/* =========================================================
TEXT PARSER
========================================================= */

function executeTextParserEngine(text){
    text = text
    .replace(/\t/g," ")
    .replace(/ +/g," ")
    .replace(/\r/g,"");
    const lines =
    text
    .split("\n")
    .map(l=>l.trim())
    .filter(l=>l.length>0);

    let topic = "Chung";

    let added = 0;

    for(
        let i=0;
        i<lines.length;
        i++
    ){

        const line = lines[i];

        /* detect topic */

        if(

            /^BÀI\s*\d*/i.test(line)
    ||
    /^CHỦ ĐỀ/i.test(line)
    ||
    /^TỪ VỰNG/i.test(line)

        ){

            topic = line;

            continue;
        }

        /* detect chinese */

        if(
           /[\u4e00-\u9fa5]/.test(line)
    &&
    !/[。！？,.!?]/.test(line)
    &&
    line.length <= 12
        ){

            const item = {

                cn:
                line || "",

                py:
                lines[i+1] || "",

                vn:
                lines[i+2] || "",

                ex_cn:
                lines[i+3] || "",

                ex_py:
                lines[i+4] || "",

                ex_vn:
                lines[i+5] || "",

                topic:
                topic
            };

            const existed =
            globalDatabase.some(
                d=>
d.cn===item.cn
&&
d.topic===item.topic
            );

            if(!existed){

                globalDatabase.push(item);

                added++;
            }

            i += 5;
        }
    }

    try{

    localStorage.setItem(

        "zh_master_db",

        JSON.stringify(
            globalDatabase
        )
    );

}catch(e){

    alert(
        "⚠️ Dữ liệu quá lớn cho localStorage"
    );
}
    safeText(
        "status-msg",
        `✅ Đã nạp ${added} từ mới`
    );

    renderHomeDashboard();
}

/* =========================================================
HOME DASHBOARD
========================================================= */

function renderHomeDashboard(){

    safeText(

        "count-vocab",

        globalDatabase.length
    );

    safeText(

        "count-topic",

        new Set(
            globalDatabase.map(
                d=>d.topic
            )
        ).size
    );

    if(globalDatabase.length>0){

        document
        .getElementById(
            "workflow-skill-section"
        )
        .classList.remove("hidden");

        buildTopicSelectionList();
    }
}

/* =========================================================
BUILD TOPIC LIST
========================================================= */

function buildTopicSelectionList(){

    const container =
    document.getElementById(
        "workflow-topic-container-list"
    );

    container.innerHTML = "";

    const topics = [

        ...new Set(
            globalDatabase.map(
                d=>d.topic
            )
        )

    ];

    topics.forEach(topic=>{

        const count =
        globalDatabase.filter(
            d=>d.topic===topic
        ).length;

        const btn =
        document.createElement("button");

        btn.className =
        "topic-card";

        btn.innerHTML = `

        <div class="topic-title">
            📂 ${topic}
        </div>

        <div class="topic-count">
            ${count} từ
        </div>

        `;

        btn.onclick = ()=>{

            currentActiveTopicName =
            topic;

            currentWords =
            globalDatabase.filter(
                d=>d.topic===topic
            );

            if(activeSkillMode){

                initStudyEngineView();

            }else{

                renderTopicPreviewMode(
                    topic
                );
            }
        };

        container.appendChild(btn);
    });
}

/* =========================================================
PREVIEW MODE
========================================================= */

function renderTopicPreviewMode(topic){

    selectedTopicForStudy = topic;

    document
    .querySelectorAll(
        ".tab-pane-view"
    )
    .forEach(el=>{

        el.classList.add("hidden");
    });

    const previewSec=document.getElementById("sec-preview");
    if(!previewSec){console.error("Missing #sec-preview");return;}
    previewSec.classList.remove("hidden");

    safeText(

        "preview-heading-title",

        `Khái quát: ${topic}`
    );

    const box =
    document.getElementById(
        "preview-cards-scroller"
    );

    box.innerHTML = "";

    currentWords.forEach(word=>{

        const div =
        document.createElement("div");

        div.className =
        "preview-card";

        div.innerHTML = `

        <div class="preview-main">

            <div>

                <div class="preview-cn">
                    ${word.cn}
                </div>

                <div class="preview-py">
                    ${word.py}
                </div>

            </div>

            <div class="preview-vn">
                ${word.vn}
            </div>

        </div>

        <div class="preview-divider"></div>

        <div class="preview-ex-cn">
            ${word.ex_cn || ""}
        </div>

        <div class="preview-ex-py">
            ${word.ex_py}
        </div>

        <div class="preview-ex-vn">
            ${word.ex_vn}
        </div>

        `;

        box.appendChild(div);
    });
}

function escapeHTML(str){

    if(!str) return "";

    return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function activateLearningWorkflow(){

    document
    .getElementById("sec-preview")
    .classList.add("hidden");

    document
    .getElementById("sec-home")
    .classList.remove("hidden");
}

/* =========================================================
SKILL MODE
========================================================= */

function toggleWorkflowSkill(skill){

    activeSkillMode = skill;

    if(
        window.selectedTopicWords &&
        window.selectedTopicWords.length
    ){
        currentWords =
        [...window.selectedTopicWords];
    }

    if(
        !currentWords ||
        currentWords.length===0
    ){
        alert(
            "❌ Chưa chọn chủ đề"
        );

        return;
    }

    switch(skill){

        case "write":

            openWriteMode();

            break;

        default:

            alert(
                "Kỹ năng này sẽ làm sau"
            );

    }

}

function buildChineseClickable(text){

    if(!text) return "";

    return Array.from(text)
    .map(ch=>{

        if(/[\u4e00-\u9fa5]/.test(ch)){

            return `
<span class="zh-char" title="Click để xem phân tích">
    ${ch}
</span>
`;
        }

        return ch;

    })
    .join("");
}

function buildFourMultipleChoicesOptions(correct){

    const wrapper=
    document.getElementById(
        "rd-quiz-options-wrapper"
    );

    wrapper.replaceChildren();

    let wrongs =
shuffleArray(
    globalDatabase
    .filter(d => d.vn && d.vn !== correct)
)
.slice(0,3)
.map(d => d.vn);

    let options=[
        correct,
        ...wrongs
    ]
    .sort(()=>Math.random()-0.5);

    options.forEach(op=>{

        const btn=
        document.createElement("button");

        btn.className=
        "quiz-option-btn";

        btn.innerText=op;

        btn.onclick=()=>{

            if(op===correct){

                alert("✅ Chính xác");

                revealNextButton();

            }else{

                alert("❌ Sai");
            }
        };

        wrapper.appendChild(btn);
    });
}

/* =========================================================
LISTEN MODE
========================================================= */

function buildListenPuzzleLayout(sentence){

    puzzleSelectedChips=[];
document.getElementById("l-puzzle-pool").innerHTML = "";
document.getElementById("l-puzzle-drop").innerHTML = "";
    const chars = shuffleArray(
    Array.from(sentence).filter(c => c.trim() !== "")
);

    const pool=
    document.getElementById(
        "l-puzzle-pool"
    );

    pool.innerHTML="";

    chars.forEach(ch=>{

        const chip=
        document.createElement("span");

        chip.className=
        "puzzle-chip";

        chip.innerText=ch;

        chip.onclick=()=>{

            if(
                chip.classList.contains("used")
            ){
                return;
            }

            chip.classList.add("used");

            puzzleSelectedChips.push(ch);

            renderPuzzleDropZone();
        };

        pool.appendChild(chip);
    });

    renderPuzzleDropZone();
}

function shuffleArray(arr){
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function renderPuzzleDropZone(){

    document
    .getElementById(
        "l-puzzle-drop"
    )
    .innerHTML=`

    <div style="
    min-height:80px;
    padding:18px;
    background:#f1f5f9;
    border-radius:18px;
    font-size:34px;
    ">
        ${puzzleSelectedChips.join("")}
    </div>

    `;
}

function verifyListenPuzzle(){

    const normalize = str =>
        str.replace(/\s/g,"");

    const ans = normalize(puzzleSelectedChips.join(""));
    const target = normalize(currentActiveSentenceTarget);

    if(ans === target){

        alert("✅ Chính xác");
        revealNextButton();

    }else{

        alert(`
❌ Sai rồi

Đáp án:
${currentActiveSentenceTarget}
        `);
    }
}

    voiceRecognitionEngine.start();

    safeText(

voiceRecognitionEngine.onresult = function(event){

    const transcript =
        event.results[0][0].transcript.trim();

    const target =
        currentWords?.[activeIdx]?.cn?.trim() || "";

    const normalize = str =>
        str.toLowerCase()
            .replace(/\s/g,"")
            .replace(/[。，！？,.!?]/g,"");

    safeText(
        "sp-feedback-msg",
        `Bạn nói: ${transcript}`
    );

    if(normalize(transcript) === normalize(target)){

        alert("✅ Phát âm đúng");
        revealNextButton();

    }else{

        alert(`
❌ Chưa chính xác

Bạn nói:
${transcript}

Đáp án:
${target}
        `);
    }
};
    voiceRecognitionEngine.onerror=
    function(){

        safeText(
            "sp-feedback-msg",
            "❌ Không nhận diện được giọng nói"
        );
    };
}

    container.innerHTML="";

    const topics=[
        ...new Set(
            globalDatabase.map(
                d=>d.topic
            )
        )
    ];

    topics.forEach(topic=>{

        const count=
        globalDatabase.filter(
            d=>d.topic===topic
        ).length;

        const btn=
        document.createElement("button");

        btn.className=
        "topic-card";

        btn.innerHTML=`

        <div>

            <div class="topic-title">
                📝 ${topic}
            </div>

            <div style="
            margin-top:8px;
            font-size:18px;
            color:#64748b;
            ">
                ${count} từ vựng
            </div>

        </div>

        <div style="
        font-size:32px;
        ">
            ➜
        </div>

        `;

        btn.onclick=()=>{

            buildTestEngine(topic);
        };

        container.appendChild(btn);
    });
}

/* =========================================================
BUILD TEST ENGINE
========================================================= */

function buildTestEngine(topic){

    currentWords=
    globalDatabase
    .filter(d=>d.topic===topic)
    .sort(()=>Math.random()-0.5)
    .slice(0,10);

    testIdx=0;
    testScore=0;

    document
    .getElementById("sec-home")
    .classList.add("hidden");

    document
    .getElementById("sec-preview")
    .classList.add("hidden");

    document
    .getElementById(
        "study-engine-board"
    )
    .classList.add("hidden");

    document
    .getElementById(
        "test-engine-board"
    )
    .classList.remove("hidden");

    loadTestQuestion();
}

/* =========================================================
LOAD TEST QUESTION
========================================================= */

function loadTestQuestion(){

    const q=
    currentWords[testIdx];

    const box=
    document.getElementById(
        "test-question-content-box"
    );

    box.innerHTML=`

    <div style="
    background:white;
    padding:30px;
    border-radius:24px;
    border:1px solid #d7e0ec;
    ">

        <div style="
        font-size:22px;
        color:#64748b;
        margin-bottom:24px;
        ">
            Câu ${testIdx+1}
            / ${currentWords.length}
        </div>

        <div style="
        font-size:34px;
        font-weight:700;
        margin-bottom:24px;
        ">
            Nghĩa của từ:
        </div>

        <div style="
        font-size:72px;
        font-weight:800;
        margin-bottom:30px;
        ">
            ${q.cn}
        </div>

        <input
            id="t-ans"
            placeholder="Nhập nghĩa tiếng Việt..."
            style="
            width:100%;
            padding:20px;
            border-radius:18px;
            border:1px solid #d7e0ec;
            font-size:22px;
            margin-bottom:24px;
            "
        >

        <button
    id="test-check-btn"
    style="
        border:none;
        padding:18px 26px;
        border-radius:18px;
        background:#3b82f6;
        color:white;
        font-size:22px;
        font-weight:700;
        cursor:pointer;
    "
>
    Kiểm tra
</button>

    </div>

    `;
setTimeout(()=>{
    document.getElementById("test-check-btn")
        ?.addEventListener("click", executeTestAnswerVerification);
},0);
}

/* =========================================================
VERIFY TEST ANSWER
========================================================= */

function executeTestAnswerVerification(){

    const q=
    currentWords[testIdx];

    const ans=
    document
    .getElementById("t-ans")
    .value
    .trim()
    .toLowerCase();

    const correct=
    q.vn
    .trim()
    .toLowerCase();

    if(ans===correct){

        testScore++;

        alert("✅ Chính xác");

    }else{

        alert(`
❌ Sai rồi

Đáp án:
${q.vn}
        `);
    }

    if(
        testIdx <
        currentWords.length-1
    ){

        testIdx++;

        loadTestQuestion();

    }else{

        renderFinalTestResult();
    }
}

/* =========================================================
FINAL RESULT
========================================================= */

function renderFinalTestResult(){

    const percent=
    Math.round(
        (
            testScore /
            currentWords.length
        )*100
    );

    document
    .getElementById(
        "test-question-content-box"
    )
    .innerHTML=`

    <div style="
    background:white;
    border-radius:30px;
    padding:50px;
    text-align:center;
    border:1px solid #d7e0ec;
    ">

        <div style="
        font-size:42px;
        font-weight:800;
        margin-bottom:20px;
        ">
            🎉 Hoàn thành bài kiểm tra
        </div>

        <div style="
        font-size:80px;
        font-weight:800;
        color:#10b981;
        margin-bottom:20px;
        ">
            ${testScore}
            /
            ${currentWords.length}
        </div>

        <div style="
        font-size:42px;
        font-weight:700;
        color:#3b82f6;
        margin-bottom:40px;
        ">
            ${percent}%
        </div>

        <button
            onclick="
            changeMainTab('home')
            "
            style="
            border:none;
            padding:20px 34px;
            border-radius:18px;
            background:#24364b;
            color:white;
            font-size:22px;
            font-weight:700;
            cursor:pointer;
            "
        >
            ← Về trang chủ
        </button>

    </div>

    `;
}

function restartTest(){
    testIdx = 0;
    testScore = 0;
    currentWords = [];
    changeMainTab('test');
}

/* =========================================================
NAVIGATION
========================================================= */

function changeMainTab(tabName){

    // reset state
    testIdx = 0;
    testScore = 0;
    activeIdx = 0;

    document.querySelectorAll(".nav-btn")
        .forEach(btn => btn.classList.remove("active"));

    const nav = document.getElementById(`nav-${tabName}`);
    if(nav) nav.classList.add("active");

    // hide all sections
    document.getElementById("sec-home")?.classList.add("hidden");
    document.getElementById("sec-preview")?.classList.add("hidden");
    document.getElementById("study-engine-board")?.classList.add("hidden");
    document.getElementById("test-engine-board")?.classList.add("hidden");

    // show target
    if(tabName === "home"){
        document.getElementById("sec-home")?.classList.remove("hidden");
        renderHomeDashboard();
    }

    if(tabName === "test"){
        document.getElementById("test-engine-board")?.classList.remove("hidden");
        renderTestDashboard();
    }
}
/* =========================================================
AUTO INIT
========================================================= */

renderHomeDashboard();

</script>

<script>
window.startTopicStudy=function(topicId){
    sessionStorage.setItem('selectedTopicWords',JSON.stringify(window.currentWords||[]));
    sessionStorage.setItem('selectedTopicName',window.currentActiveTopicName||'');
    window.selectedTopicForStudy = topicId || window.currentActiveTopicName || null;

    const preview=document.getElementById('sec-preview');
    if(preview) preview.classList.add('hidden');

    const workflow=document.getElementById('workflow-skill-section');
    if(workflow) workflow.classList.remove('hidden');

    const board=document.getElementById('study-engine-board');
    if(board) board.classList.add('hidden');

    if(typeof changeMainTab==='function'){
      try{ changeMainTab('home'); }catch(e){}
    }
};
</script>


<script>
document.addEventListener('click',function(e){
 const btn=e.target.closest('#btn-start-topic-study');
 if(!btn) return;
 if(window.currentWords && currentWords.length){
   sessionStorage.setItem('selectedTopicWords', JSON.stringify(currentWords));
   sessionStorage.setItem('selectedTopicName', window.currentActiveTopicName||'');
 }
});
(function(){
 const orig=window.initStudyEngineView;
 if(orig){
   window.initStudyEngineView=function(){
      if((!window.currentWords || currentWords.length===0)){
        const saved=sessionStorage.getItem('selectedTopicWords');
        if(saved){
          try{ window.currentWords=JSON.parse(saved);}catch(e){}
        }
      }
      if(!window.activeSkillMode || activeSkillMode===''){
         activeSkillMode='read';
      }
      return orig.apply(this,arguments);
   }
 }
})();
</script>

<script>
(function(){
 const orig=window.toggleWorkflowSkill;
 if(orig){
   window.toggleWorkflowSkill=function(skill){
      const saved=sessionStorage.getItem('selectedTopicWords');
      const topic=sessionStorage.getItem('selectedTopicName');
      if(saved){
        try{ window.currentWords=JSON.parse(saved);}catch(e){}
      }
      if(topic) window.currentActiveTopicName=topic;
      return orig(skill);
   }
 }
})();
</script>
