<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HánStudy – Học Tiếng Trung AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="database.js"></script> 
    <style>
        /* CSS 3 hộp ngang hàng và giao diện sáng */
        :root { --bg-main: #f4f7f6; --bg-card: #ffffff; --bg-input: #f8fafc; --border: #cbd5e1; --text-primary: #1e293b; }
        body { background-color: var(--bg-main); padding: 20px; font-family: sans-serif; }
        .container { max-width: 1000px; margin: auto; background: var(--bg-card); padding: 32px; border-radius: 24px; border: 1px solid var(--border); }
        .top-dashboard-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .upload-box { border: 2px dashed var(--border); padding: 20px; text-align: center; border-radius: 16px; cursor: pointer; background: var(--bg-input); }
        .stat-box-card { background: var(--bg-input); border: 1px solid var(--border); padding: 20px; border-radius: 16px; text-align: center; }
        .hidden { display: none !important; }
        .radical-pane { background: #fff8db; padding: 20px; border-radius: 14px; margin-top: 20px; border-left: 4px solid #f59e0b; }
        .action-btn-primary { width: 100%; padding: 16px; background: #2c3e50; color: white; border-radius: 14px; cursor: pointer; margin-top: 24px; border: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="main-nav">
        <button class="nav-btn active" onclick="changeMainTab('home')">🏠 Trang Chủ</button>
        <button class="nav-btn" onclick="changeMainTab('test')">📝 Kiểm Tra</button>
    </div>

    <div id="sec-home" class="tab-pane-view">
        <div class="top-dashboard-grid">
            <div class="upload-box" onclick="document.getElementById('file-input').click()">📁 Tải file học tập</div>
            <div class="stat-box-card">Từ vựng: <div id="count-vocab">0</div></div>
            <div class="stat-box-card">Chủ đề: <div id="count-topic">0</div></div>
        </div>
        <input type="file" id="file-input" class="hidden" onchange="triggerUploadParser(this)">
        <div id="workflow-skill-section" class="hidden">
            <button onclick="toggleWorkflowSkill('write')">Viết</button>
            <button onclick="toggleWorkflowSkill('read')">Đọc</button>
            <button onclick="toggleWorkflowSkill('listen')">Nghe</button>
            <button onclick="toggleWorkflowSkill('speak')">Nói</button>
        </div>
        <div id="workflow-topic-container-list"></div>
    </div>

    <div id="panel-radical-analysis" class="radical-pane hidden"></div>
    <div id="study-engine-board" class="hidden">
        </div>
</div>

<script>
    // Bạn hãy chèn các hàm logic: triggerUploadParser, executeTextParserEngine, 
    // toggleWorkflowSkill, shiftNextWord, buildTestEngine... vào đây.
    // Đảm bảo trong hàm refreshEngineCardLayoutData, bạn gọi:

    //    s.onclick = () => executeAIRadicalAnalyzer(s.innerText));
</script>
</body>
</html>
