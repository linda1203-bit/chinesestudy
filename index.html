        // [Dán toàn bộ các hàm: triggerUploadParser, executeTextParserEngine, ... từ v29 của bạn vào đây]
  function triggerUploadParser(input) {
    const file = input.files[0]; if(!file) return;
    document.getElementById('status-msg').innerText = "🔄 Đang bóc tách dữ liệu tài liệu...";
    const reader = new FileReader();
    reader.onload = function(e) {
      if(file.name.endsWith('.docx')) mammoth.extractRawText({ arrayBuffer: e.target.result }).then(r => executeTextParserEngine(r.value));
      else pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise.then(pdf => {
        let p = [];
        for(let i=1; i<=pdf.numPages; i++) p.push(pdf.getPage(i).then(pg => pg.getTextContent().then(c => c.items.map(m => m.str).join(' '))));
        Promise.all(p).then(t => executeTextParserEngine(t.join('\n')));
      });
    };
    reader.readAsArrayBuffer(file);
  }

  function executeTextParserEngine(txt) {
    const lines = txt.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    let topic = "Chung", count = 0;
    for(let i=0; i<lines.length; i++) {
      if(/^\d+\./.test(lines[i]) || lines[i].includes("TỪ VỰNG")) { topic = lines[i]; continue; }
      if(/[\u4e00-\u9fa5]/.test(lines[i]) && !lines[i].includes("Từ vựng") && !lines[i].includes("Pinyin")) {
        let w = { cn: lines[i], py: lines[i+1]||"", vn: lines[i+2]||"", ex_cn: lines[i+3]||"", ex_py: lines[i+4]||"", ex_vn: lines[i+5]||"", topic: topic, date: new Date().toLocaleDateString('vi-VN') };
        if(w.vn && w.ex_cn && !globalDatabase.some(d => d.cn === w.cn)) { globalDatabase.push(w); count++; }
        i += 5;
      }
    }
    localStorage.setItem('zh_master_db', JSON.stringify(globalDatabase));
    document.getElementById('status-msg').innerText = `✅ Đã nạp ${count} từ vựng!`;
    renderHomeDashboard();
  }

  // SỬA LỖI ĐƠ KẸT HIỂN THỊ: Khôi phục đồng bộ trường ex_cn toàn diện

  function buildListenPuzzleLayout(sentence) {
    puzzleSelectedChips = []; const pool = document.getElementById('l-puzzle-pool'); const drop = document.getElementById('l-puzzle-drop'); pool.innerHTML = ""; drop.innerHTML = "";
    let chips = sentence.split("").filter(c => !/[\s.,!?;。，！？]/.test(c));
    chips.sort(() => Math.random() - 0.5).forEach(c => {
      let div = document.createElement('div'); div.className = "puzzle-chip"; div.innerText = c;
      div.onclick = () => { div.classList.add('used'); let d = document.createElement('div'); d.className = "puzzle-chip"; d.innerText = c; drop.appendChild(d); puzzleSelectedChips.push(c); };
      pool.appendChild(div);
    });
  }
  function rebuildListenPuzzle() { buildListenPuzzleLayout(currentActiveSentenceTarget); }
  function verifyListenPuzzle() { document.getElementById('reveal-card-zone').classList.remove('hidden'); }

  function buildFourMultipleChoicesOptions(correct) {
    const box = document.getElementById('rd-quiz-options-wrapper'); box.innerHTML = ""; let opts = [correct]; let pool = globalDatabase.filter(w => w.vn !== correct);
    while(opts.length < 4 && pool.length > 0) { let r = pool[Math.floor(Math.random() * pool.length)].vn; if(!opts.includes(r)) opts.push(r); }
    opts.sort(() => Math.random() - 0.5).forEach(opt => {
      let b = document.createElement('button'); b.className = "quiz-option-btn"; b.innerText = opt; b.onclick = () => document.getElementById('reveal-card-zone').classList.remove('hidden');
      box.appendChild(b);
    });
  }
  function verifyWriteAnswer() { document.getElementById('reveal-card-zone').classList.remove('hidden'); }

  function activateVoiceRecognition() {
    voiceRecognitionEngine.start(); document.getElementById('mic-trigger-btn').innerText = "🎙️ Đang nghe...";
    voiceRecognitionEngine.onresult = (e) => {
      const speech = e.results[0][0].transcript; document.getElementById('mic-trigger-btn').innerText = "🎤 Bấm nói";
      let target = currentWords[activeIdx].ex_cn; let cleanSpeech = speech.replace(/[\s.,!?;。，！？、]/g, ""); let res = "Chấm điểm: ";
      for(let c of target) {
        if(/[\s.,!?;。，停！？、]/.test(c)) res += `<span style="color:var(--text-secondary);font-size:24px;">${c}</span>`;
        else if(cleanSpeech.includes(c)) res += `<span style="color:var(--accent-green);font-size:24px;font-weight:700;">${c}</span>`;
        else res += `<span style="color:var(--accent-red);font-size:24px;text-decoration:underline;font-weight:700;">${c}</span>`;
      }
      document.getElementById('sp-feedback-msg').innerHTML = res; document.getElementById('reveal-card-zone').classList.remove('hidden');
    };
  }

  // Thuật toán AI phân rã ma trận kết cấu lớp sâu bóc tách bộ thủ chuẩn xác 214 bộ ThanhMaiHSK
  function executeAIRadicalAnalyzer(char) {
    const box = document.getElementById('panel-radical-analysis'); 
    let htmlContent = ""; 
    let count = 0;
    
    let parts = AI_Decomposition_Matrix_Map[char] || [];
    if(parts.length > 0) {
      parts.forEach(p => { 
        if(TM_Radicals_Dict[p]) {
          count++; 
          htmlContent += `<p class="radical-item-text">➔ <strong>Bộ thủ [ ${p} ]:</strong> ${TM_Radicals_Dict[p]}</p>`; 
        }
      });
    }
    
    Object.keys(TM_Radicals_Dict).forEach(r => { 
      if(char.includes(r) && !htmlContent.includes(`[ ${r} ]`)) {
        count++; 
        htmlContent += `<p class="radical-item-text">➔ Chứa <strong>Bộ thủ [ ${r} ]:</strong> ${TM_Radicals_Dict[r]}</p>`; 
      }
    });
    
    box.innerHTML = `<div class="radical-header-title">🤖 AI Phân Rã & Đối Chiếu Bộ Thủ Cho Chữ: "${char}"</div>${htmlContent || "<p style='color:var(--text-secondary);'>Nét bút thuận đơn lẻ cơ bản.</p>"}`;
    box.classList.remove('hidden'); 
    box.scrollIntoView({ behavior: 'smooth' });
  }

  function speakCoreSound(t) { const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; window.speechSynthesis.speak(u); }
  function shiftNextWord() { if(activeIdx < currentWords.length - 1) { activeIdx++; refreshEngineCardLayoutData(); } else { alert("🎉 Hoàn thành chủ đề!"); location.reload(); } }

  function renderTestDashboard() {
    let container = document.getElementById('test-topic-container-list'); container.innerHTML = "";
    [...new Set(globalDatabase.map(d=>d.topic))].forEach(t => {
      let r = document.createElement('button'); r.className = "topic-item-row"; r.innerHTML = `<span>📋 Tạo đề thi chủ đề: ${t}</span><span>Bắt đầu →</span>`;
      r.onclick = () => buildTestEngine(t); container.appendChild(r);
    });
  }

  let testIdx = 0, testScore = 0;
  function buildTestEngine(scope) {
    let pool = (scope === 'ALL_TOPICS') ? globalDatabase : globalDatabase.filter(d=>d.topic === scope);
    currentWords = pool.sort(() => Math.random() - 0.5).slice(0, 10); testIdx = 0; testScore = 0;
    document.querySelectorAll('.tab-pane-view').forEach(id => id.classList.add('hidden'));
    document.getElementById('test-engine-board').classList.remove('hidden'); loadTestQ();
  }

  function loadTestQ() {
    let q = currentWords[testIdx];
    document.getElementById('test-question-content-box').innerHTML = `<div class="section-title">Câu hỏi số ${testIdx + 1}:</div><h3 style="font-size:24px;margin-bottom:8px;">Nghĩa của [ <span style="font-family:var(--font-zh);color:var(--accent-orange);font-size:32px;">${q.cn}</span> ] là gì?</h3><p style="color:var(--text-secondary);margin-bottom:12px;">Phiên âm: ${q.py}</p><input type='text' id='t-ans' class='input-field' style='text-align:left;' placeholder='Nhập nghĩa tiếng Việt...' onkeydown='listenInputEnter(event, executeTestAnswerVerification)'>`;
    setTimeout(() => document.getElementById('t-ans').focus(), 100);
  }

  function executeTestAnswerVerification() {
    let q = currentWords[testIdx];
    if(document.getElementById('t-ans').value.trim().toLowerCase() === q.vn.toLowerCase()) testScore++;
    if(testIdx < currentWords.length - 1) { testIdx++; loadTestQ(); }
    else { alert(`🎉 Hoàn thành! Kết quả: ${testScore} / ${currentWords.length}`); location.reload(); }
  }


        // --- 3. CẦU NỐI AI ---
        function executeAIRadicalAnalyzer(char) {
            const box = document.getElementById('panel-radical-analysis');
            let htmlContent = "";
            let parts = AI_Decomposition_Matrix_Map[char] || [];
            if(parts.length > 0) {
                parts.forEach(p => { if(TM_Radicals_Dict[p]) htmlContent += `<p class="radical-item-text">➔ <strong>Bộ [ ${p} ]:</strong> ${TM_Radicals_Dict[p]}</p>`; });
            } else {
                Object.keys(TM_Radicals_Dict).forEach(r => { if(char.includes(r)) htmlContent += `<p>➔ Chứa Bộ [ ${r} ]: ${TM_Radicals_Dict[r]}</p>`; });
            }
            box.innerHTML = `<div class="radical-header-title">🤖 Phân tích: "${char}"</div>${htmlContent || "<p>Nét cơ bản.</p>"}`;
            box.classList.remove('hidden');
            box.scrollIntoView({ behavior: 'smooth' });
        }

        // ĐẢM BẢO HÀM RENDER CỦA BẠN GỌI ĐƯỢC CẦU NỐI NÀY:
        function refreshEngineCardLayoutData() {
    const w = currentWords[activeIdx];
    document.getElementById('engine-header-title').innerText = `Học [${activeSkillMode.toUpperCase()}] - ${w.topic}`;
    document.getElementById('engine-progress-counter').innerText = `${activeIdx + 1}/${currentWords.length}`;
    ['panel-write', 'panel-read', 'panel-listen', 'panel-speak', 'reveal-card-zone', 'panel-radical-analysis'].forEach(id => document.getElementById(id).classList.add('hidden'));

    document.getElementById('v-main-text').innerHTML = w.cn.split("").map(c => `<span>${c}</span>`).join("");
    document.getElementById('v-py-text').innerText = w.py; document.getElementById('v-vn-text').innerText = w.vn;
    
    // Đổ móng chuẩn xác chuỗi span gạch chân đứt nét cho câu ví dụ mẫu
    document.getElementById('e-main-text').innerHTML = w.ex_cn.split("").map(c => `<span>${c}</span>`).join("");
    document.getElementById('e-py-text').innerText = w.ex_py; document.getElementById('e-vn-text').innerText = w.ex_vn;

    document.querySelectorAll('.zh-main span, .ex-zh-row span').forEach(s => s.onclick = () => executeAIRadicalAnalyzer(s.innerText));

    if (activeSkillMode === 'write') { document.getElementById('panel-write').classList.remove('hidden'); document.getElementById('wr-prompt-vn').innerText = w.vn; document.getElementById('wr-user-input').value = ""; setTimeout(() => document.getElementById('wr-user-input').focus(), 100); }
    else if (activeSkillMode === 'read') { document.getElementById('panel-read').classList.remove('hidden'); document.getElementById('rd-prompt-zh').innerText = w.cn; buildFourMultipleChoicesOptions(w.vn); }
    else if (activeSkillMode === 'listen') { document.getElementById('panel-listen').classList.remove('hidden'); currentActiveSentenceTarget = w.ex_cn; document.getElementById('l-user-input-meaning').value = ""; buildListenPuzzleLayout(w.ex_cn); speakCoreSound(w.cn); setTimeout(() => document.getElementById('l-user-input-meaning').focus(), 100); }
    else if (activeSkillMode === 'speak') { document.getElementById('panel-speak').classList.remove('hidden'); document.getElementById('sp-prompt-zh').innerText = w.ex_cn; document.getElementById('sp-feedback-msg').innerText = ""; }
            setTimeout(() => {
                document.querySelectorAll('.zh-main span, .ex-zh-row span').forEach(s => {
                    s.onclick = () => executeAIRadicalAnalyzer(s.innerText);
                });
            }, 500);
        }
    </script>
