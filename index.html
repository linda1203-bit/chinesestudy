<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HánStudy - Học Tiếng Trung</title>
    <script src="database.js"></script> <style>
        /* CSS 3 hộp ngang hàng và giao diện sáng */
        .container { max-width: 950px; margin: auto; padding: 20px; }
        .top-dashboard-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .upload-box { border: 2px dashed #cbd5e1; padding: 20px; text-align: center; border-radius: 16px; cursor: pointer; }
        .stat-box-card { background: #f8fafc; border: 1px solid #cbd5e1; padding: 20px; border-radius: 16px; text-align: center; }
        .hidden { display: none !important; }
        .radical-pane { background: #fff8db; padding: 20px; border-radius: 14px; margin-top: 20px; border-left: 4px solid #f59e0b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-dashboard-grid">
            <div class="upload-box" onclick="document.getElementById('file-input').click()">📁 Tải file học tập</div>
            <div class="stat-box-card">Từ vựng đã nạp: <div id="count-vocab">0</div></div>
            <div class="stat-box-card">Chủ đề: <div id="count-topic">0</div></div>
        </div>
        <input type="file" id="file-input" class="hidden" onchange="handleFile(this)">
        
        <div id="panel-radical-analysis" class="radical-pane hidden"></div>
        </div>
    <script>
        // Các hàm logic của bạn...
    </script>
</body>
</html>
