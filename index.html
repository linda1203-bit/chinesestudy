<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Học Tiếng Trung Chuyên Ngành Toàn Diện v18</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #e74c3c; --bg: #f4f7f6; --success: #2ecc71; --blue: #3498db; --warning: #f1c40f; --orange: #e67e22; }
        * { font-family: 'Segoe UI', Tahoma, sans-serif !important; box-sizing: border-box; }
        body { background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .main-menu { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; flex-wrap: wrap; }
        .menu-btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; background: #e2e8f0; font-weight: bold; color: var(--primary); transition: 0.2s; }
        .menu-btn.active { background: var(--primary); color: white; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-val { font-size: 32px; font-weight: bold; color: var(--accent); }
        .item-row { padding: 15px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 8px; display: block; text-align: left; width: 100%; color: var(--primary); }
        .item-row:hover { background: var(--primary); color: white; }
        .interactive-card { border: 2px solid #e2e8f0; border-radius: 12px; padding: 25px; background: #f8fafc; margin-top: 15px; text-align: center; }
        .vocab-main { font-size: 55px; font-weight: bold; color: #000000; margin: 10px 0; letter-spacing: 2px; }
        .vocab-main span { cursor: help; border-bottom: 2px dashed #cbd5e1; padding: 0 4px; display: inline-block; }
        .vocab-main span:hover { color: var(--blue); background: #ffe082; }
        .pinyin { font-size: 22px; color: #7f8c8d; }
        .meaning { font-size: 26px; font-weight: bold; color: var(--accent); }
        .example-block-container { text-align: left; background: #fff; padding: 20px; border-radius: 8px; border-left: 5px solid var(--accent); margin-top: 20px; }
        .chip-pool, .drop-zone { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 55px; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 8px; margin: 15px 0; }
        .chip { padding: 8px 15px; background: #e2e8f0; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 18px; color: var(--primary); }
        .chip.used { opacity: 0.3; pointer-events: none; }
        .reveal-zone { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 20px; }
        .analysis-pane { text-align: left; background: #fff8db; border-left: 5px solid #f1c40f; padding: 20px; margin-top: 20px; border-radius: 5px; }
        .input-field { width: 80%; padding: 12px; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="main-menu">
        <button class="menu-btn active" id="nav-home" onclick="switchMainTab('home')">🏠 Trang Chủ & Học Mới</button>
        <button class="menu-btn" id="nav-test" onclick="switchMainTab('test')">📝 Làm Bài Kiểm Tra</button>
    </div>

    <div id="sec-home" class="tab-content">
        <div class="stats-grid" id="stats-area"></div>
        <div style="border: 3px dashed #bdc3c7; padding: 30px; text-align: center; border-radius: 10px; background: #fafbfc; cursor: pointer;" onclick="document.getElementById('file-input').click()">
            <span style="font-size: 40px;">📁</span>
            <p style="font-size: 16px; font-weight: bold; color: var(--primary);">Tải file học tập chuyên ngành mới (.pdf, .docx)</p>
            <input type="file" id="file-input" class="hidden" accept=".pdf,.docx" onchange="handleFileUpload(this)">
        </div>
        <div id="status" style="color:var(--success); font-weight:bold; margin-top:15px; text-align:center;"></div>
        <div id="workflow-skill-zone" class="hidden" style="margin-top:25px;">
            <h3>Bước 2: Chọn Kỹ Năng:</h3>
            <div class="stats-grid">
                <button class="menu-btn" style="background:#16a085; color:white;" onclick="selectWorkflowSkill('write')">✍️ 1. Viết</button>
                <button class="menu-btn" style="background:#9b59b6; color:white;" onclick="selectWorkflowSkill('read')">📖 2. Đọc</button>
                <button class="menu-btn" style="background:#3498db; color:white;" onclick="selectWorkflowSkill('listen')">🔊 3. Nghe</button>
                <button class="menu-btn" style="background:#e67e22; color:white;" onclick="selectWorkflowSkill('speak')">🎙️ 4. Nói</button>
            </div>
        </div>
        <div id="workflow-topic-zone" class="hidden" style="margin-top:25px;">
            <h3>Bước 3: Chọn Chủ Đề:</h3>
            <div id="workflow-topic-list"></div>
        </div>
    </div>

    <div id="sec-test" class="tab-content hidden">
        <h3>📝 Trình Kiểm Tra</h3>
        <button class="menu-btn" style="background:var(--success); color:white; width:100%; margin-bottom:15px; padding:15px;" onclick="generateTest('ALL_TOPICS')">🎯 KIỂM TRA TỔNG HỢP</button>
        <div id="test-topic-list"></div>
    </div>

    <div id="study-engine" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ddd; padding-bottom:10px; margin-bottom:15px;">
            <div style="width:30px;"></div><h3 id="engine-title" style="margin:0;"></h3><strong id="engine-progress">0/0</strong>
        </div>
        <div class="interactive-card">
            <div id="reveal-zone" class="reveal-zone hidden">
                <div class="vocab-main" id="v-main"></div>
                <div class="pinyin" id="v-py"></div>
                <div class="meaning" id="v-vn"></div>
                <div style="margin: 15px 0;">
                    <button class="menu-btn" style="background:var(--blue); color:white;" onclick="speakText(currentList[idx].cn)">🔊 Từ vựng</button>
                    <button class="menu-btn" style="background:var(--success); color:white;" onclick="speakText(currentList[idx].e_cn)">🔊 Câu ví dụ</button>
                </div>
                <div class="example-block-container" id="example-area">
                    <div class="row-ex-main" id="e-main"></div>
                    <div class="row-ex-pinyin" id="e-py"></div>
                    <div class="row-ex-meaning" id="e-vn"></div>
                </div>
            </div>

            <div id="ui-write" class="hidden">
                <h2 style="color:var(--accent);" id="wr-target-meaning"></h2>
                <input type="text" id="wr-input" class="input-field" placeholder="Gõ lại chữ Hán...">
                <button class="menu-btn" style="background:var(--blue); color:white; margin-top:15px;" onclick="document.getElementById('reveal-zone').classList.remove('hidden')">🔍 Kiểm tra</button>
            </div>

            <div id="ui-read" class="hidden">
                <h1 style="font-size:55px; margin:20px 0;" id="rd-target-word"></h1>
                <div id="rd-options-box"></div>
            </div>

            <div id="ui-listen" class="hidden">
                <button class="menu-btn" style="background:var(--blue); color:white;" onclick="speakText(currentList[idx].cn)">🔊 Nghe từ</button>
                <button class="menu-btn" style="background:var(--success); color:white;" onclick="speakText(currentList[idx].e_cn)">🔊 Nghe câu</button>
                <div class="drop-zone" id="l-drop"></div><div class="chip-pool" id="l-pool"></div>
                <button class="menu-btn" style="background:var(--success); color:white;" onclick="document.getElementById('reveal-zone').classList.remove('hidden')">✅ Nộp bài</button>
            </div>

            <div id="ui-speak" class="hidden">
                <h2 style="font-size:36px; margin:20px 0;" id="sp-target-sentence"></h2>
                <button class="menu-btn" style="background:var(--accent); color:white;" id="mic-btn" onclick="startVoiceRecognition()">🎤 Bấm nói</button>
            </div>

            <div id="analysis-area" class="analysis-pane hidden"></div>
            <button class="menu-btn" style="margin-top:30px; background:var(--primary); color:white; width:100%;" onclick="nextWord()">TIẾP THEO →</button>
        </div>
    </div>

    <div id="ui-test-core" class="hidden interactive-card">
        <div id="test-q-box"></div>
        <button class="menu-btn" style="background:var(--success); color:white; width:100%; margin-top:20px;" onclick="submitTestQ()">Xác nhận</button>
    </div>
</div>

<script>
    // DỮ LIỆU CỐ ĐỊNH PHÂN TÍCH CHIẾT TỰ SÂU (BỐC TÁCH THÀNH PHẦN TRONG CHỮ)
    const AI_Decomposition_Map = {
        "同": ["冂", "口"], "好": ["女", "子"], "劳": ["艹", "力"], "动": ["云", "力"],
        "职": ["耳", "只"], "位": ["亻", "立"], "会": ["人", "云"], "计": ["言", "十"],
        "修": ["亻", "攵", "彡"], "改": ["己", "攵"], "合": ["人", "一", "口"],
        "证": ["讠", "正"], "险": ["阝", "佥"], "薪": ["艹", "新"], "金": ["人", "干"],
        "钢": ["钅", "冈"], "材": ["木", "才"], "核": ["木", "亥"], "算": ["竹", "目", "廾"]
    };

    const AI_Radicals_Matrix = {
        "冂": "Bộ Quynh - Vùng biên giới xa xôi bao quanh.",
        "口": "Bộ Khẩu - Cái miệng, ngôn ngữ, ăn uống.",
        "女": "Bộ Nữ - Người phụ nữ, gia đình[cite: 2].",
        "子": "Bộ Tử - Đứa trẻ, tốt lành viên mãn[cite: 2, 3].",
        "艹": "Bộ Thảo - Cỏ cây hoa lá[cite: 2, 3].",
        "力": "Bộ Lực - Sức mạnh, lao động cày ruộng[cite: 2, 3].",
        "亻": "Bộ Nhân đứng - Hành vi con người[cite: 2].",
        "立": "Bộ Lập - Đứng thẳng, vị trí[cite: 2].",
        "耳": "Bộ Nhĩ - Cái tai, nghe ngóng[cite: 2].",
        "言": "Bộ Ngôn - Lời nói, giao tiếp[cite: 2].",
        "讠": "Bộ Ngôn (giản thể) - Ngôn ngữ, trả lời.",
        "钅": "Bộ Kim (giản thể) - Kim loại, thép tấm[cite: 2].",
        "木": "Bộ Mộc - Cây cối, vật liệu gỗ[cite: 2].",
        "竹": "Bộ Trúc - Cây tre, sổ sách thẻ tre[cite: 2].",
        "目": "Bộ Mục - Con mắt nhìn nhận[cite: 2].",
        "廾": "Bộ Củng - Hai tay nâng vật lên[cite: 2].",
        "阝": "Bộ Phụ - Núi đồi, gò đất cao[cite: 2].",
        "攵": "Bộ Phác - Đánh khẽ, răn dạy học tập[cite: 2].",
        "彡": "Bộ Sâm - Lông tóc, hoa văn trang trí[cite: 2].",
        "人": "Bộ Nhân - Con người đứng thẳng[cite: 2]."
    };

    let db = JSON.parse(localStorage.getItem('zh_master_db')) || [];
    let currentSkill = 'write', currentList = [], idx = 0;
    let rec = ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) ? new (window.SpeechRecognition || window.webkitSpeechRecognition)() : null;
    if(rec) { rec.lang = 'zh-CN'; rec.interimResults = false; }

    function switchMainTab(t) {
        document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById('study-engine').classList.add('hidden');
        document.getElementById(`nav-${t}`).classList.add('active');
        document.getElementById(`sec-${t}`).classList.remove('hidden');
    }

    function renderHome() {
        document.getElementById('stats-area').innerHTML = `<div class="stat-card">Từ vựng: ${db.length}</div><div class="stat-card">Chủ đề: ${new Set(db.map(d=>d.topic)).size}</div>`;
        if(db.length > 0) document.getElementById('workflow-skill-zone').classList.remove('hidden');
    }

    function selectWorkflowSkill(s) {
        currentSkill = s;
        const cont = document.getElementById('workflow-topic-list'); cont.innerHTML = "";
        [...new Set(db.map(d=>d.topic))].forEach(t => {
            let b = document.createElement('button'); b.className = "item-row";
            b.innerHTML = `📂 ${t} (${db.filter(x=>x.topic===t).length} từ)`;
            b.onclick = () => { currentList = db.filter(x=>x.topic===t); idx = 0; startEngine(); };
            cont.appendChild(b);
        });
        document.getElementById('workflow-topic-zone').classList.remove('hidden');
    }

    function startEngine() {
        document.getElementById('sec-home').classList.add('hidden');
        document.getElementById('study-engine').classList.remove('hidden');
        loadWord();
    }

    function handleFileUpload(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            if(input.files[0].name.endsWith('.docx')) mammoth.extractRawText({arrayBuffer: e.target.result}).then(r => process(r.value));
            else pdfjsLib.getDocument(new Uint8Array(e.target.result)).promise.then(pdf => {
                let p = [];
                for(let i=1; i<=pdf.numPages; i++) p.push(pdf.getPage(i).then(pg => pg.getTextContent().then(c => c.items.map(m => m.str).join(" "))));
                Promise.all(p).then(t => process(t.join("\n")));
            });
        };
        reader.readAsArrayBuffer(input.files[0]);
    }

    function process(txt) {
        const lines = txt.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let topic = "Chung", count = 0;
        for(let i=0; i<lines.length; i++) {
            if(/^\d+\./.test(lines[i])) topic = lines[i];
            if(/[\u4e00-\u9fa5]/.test(lines[i]) && !lines[i].includes("Từ vựng")) {
                let w = { cn: lines[i], py: lines[i+1]||"", vn: lines[i+2]||"", e_cn: lines[i+3]||"", e_py: lines[i+4]||"", e_vn: lines[i+5]||"", topic: topic, date: new Date().toLocaleDateString('vi-VN') };
                if(!db.some(x => x.cn === w.cn)) { db.push(w); count++; }
                i += 5;
            }
        }
        localStorage.setItem('zh_master_db', JSON.stringify(db));
        renderHome();
    }

    function loadWord() {
        const w = currentList[idx];
        document.getElementById('engine-progress').innerText = `${idx+1}/${currentList.length}`;
        document.getElementById('engine-title').innerText = `${currentSkill.toUpperCase()} - ${w.topic}`;
        ['ui-listen', 'ui-speak', 'ui-read', 'ui-write', 'reveal-zone', 'analysis-area'].forEach(id => document.getElementById(id).classList.add('hidden'));

        document.getElementById('v-main').innerHTML = w.cn.split("").map(c => `<span onclick="runAICharacterParser('${c}')">${c}</span>`).join("");
        document.getElementById('v-py').innerText = w.py; document.getElementById('v-vn').innerText = w.vn;
        document.getElementById('e-main').innerHTML = w.e_cn.split("").map(c => `<span onclick="runAICharacterParser('${c}')">${c}</span>`).join("");
        document.getElementById('e-py').innerText = w.e_py; document.getElementById('e-vn').innerText = w.e_vn;

        if(currentSkill === 'write') { document.getElementById('ui-write').classList.remove('hidden'); document.getElementById('wr-target-meaning').innerText = w.vn; }
        else if(currentSkill === 'read') { document.getElementById('ui-read').classList.remove('hidden'); document.getElementById('rd-target-word').innerText = w.cn; buildRead(w.vn); }
        else if(currentSkill === 'listen') { document.getElementById('ui-listen').classList.remove('hidden'); setupListen(w.e_cn); speakText(w.cn); }
        else if(currentSkill === 'speak') { document.getElementById('ui-speak').classList.remove('hidden'); document.getElementById('sp-target-sentence').innerText = w.e_cn; }
    }

    function buildRead(correct) {
        const box = document.getElementById('rd-options-box'); box.innerHTML = "";
        let opts = [correct]; let pool = db.filter(x => x.vn !== correct);
        while(opts.length < 4 && pool.length > 0) { let r = pool[Math.floor(Math.random()*pool.length)].vn; if(!opts.includes(r)) opts.push(r); }
        opts.sort(()=>Math.random()-0.5).forEach(o => {
            let b = document.createElement('button'); b.className = "quiz-option"; b.innerText = o;
            b.onclick = () => document.getElementById('reveal-zone').classList.remove('hidden');
            box.appendChild(b);
        });
    }

    function setupListen(sentence) {
        const pool = document.getElementById('l-pool'); const drop = document.getElementById('l-drop');
        pool.innerHTML = ""; drop.innerHTML = ""; let chips = sentence.split("").filter(c => !/[\s.,!?;。，！？]/.test(c));
        chips.sort(()=>Math.random()-0.5).forEach(c => {
            let b = document.createElement('div'); b.className = "chip"; b.innerText = c;
            b.onclick = () => { b.classList.add('used'); let d = document.createElement('div'); d.className = "chip"; d.innerText = c; drop.appendChild(d); };
            pool.appendChild(b);
        });
    }

    // THUẬT TOÁN AI PHÂN TÍCH CHỮ SÂU - BÓC TÁCH BỘ THỦ TRONG CHỮ
    function runAICharacterParser(char) {
        const box = document.getElementById('analysis-area');
        let html = "";
        
        // Bước 1: Tra cứu ma trận phân rã chữ (Deep Decomposition)
        let components = AI_Decomposition_Map[char] || [];
        
        // Bước 2: Quét tất cả các thành phần để tìm bộ thủ tương ứng
        if(components.length > 0) {
            components.forEach(comp => {
                if(AI_Radicals_Matrix[comp]) {
                    html += `<p style='margin:8px 0; color:#d35400;'>➔ <strong>Bộ [ ${comp} ]:</strong> ${AI_Radicals_Matrix[comp]}</p>`;
                }
            });
        } else {
            // Bước 3: Nếu là chữ đơn, quét trực tiếp trong bộ thủ
            Object.keys(AI_Radicals_Matrix).forEach(r => {
                if(char.includes(r)) html += `<p style='margin:8px 0; color:#34495e;'>➔ Chứa <strong>Bộ [ ${r} ]:</strong> ${AI_Radicals_Matrix[r]}</p>`;
            });
        }

        box.innerHTML = `<div style="font-weight:bold; border-bottom:2px solid #f1c40f; padding-bottom:5px;">🔍 AI PHÂN TÍCH BỘ THỦ CHO CHỮ: "${char}"</div>${html || "<p>Chữ cơ bản được cấu tạo từ các nét bút thuận đơn lẻ.</p>"}`;
        box.classList.remove('hidden');
        box.scrollIntoView({ behavior: 'smooth' });
    }

    function startVoiceRecognition() {
        rec.start(); document.getElementById('mic-btn').classList.add('active');
        rec.onresult = (e) => {
            const speech = e.results[0][0].transcript;
            document.getElementById('mic-btn').classList.remove('active');
            let target = currentList[idx].e_cn;
            let cleanT = target.replace(/[\s.,!?;。，！？]/g, "");
            let cleanS = speech.replace(/[\s.,!?;。，！？]/g, "");
            let res = "Đối chiếu: ";
            for(let c of target) {
                if(/[\s.,!?;。，！？]/.test(c)) res += `<span style="color:#ccc; font-size:24px;">${c}</span>`;
                else if(cleanS.includes(c)) res += `<span style="color:green; font-size:24px; font-weight:bold;">${c}</span>`;
                else res += `<span style="color:red; font-size:24px; text-decoration:underline; font-weight:bold;">${c}</span>`;
            }
            document.getElementById('s-feedback').innerHTML = res;
            document.getElementById('reveal-zone').classList.remove('hidden');
        };
    }

    function speakText(t) { const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; window.speechSynthesis.speak(u); }
    function nextWord() { if(idx < currentList.length-1) { idx++; loadWord(); } else { alert("Xong!"); location.reload(); } }
    window.onload = renderHome;
</script>
</body>
</html>
