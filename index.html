<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Học Tiếng Trung Chuyên Ngành v9</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #e74c3c; --bg: #f4f7f6; --success: #2ecc71; --blue: #3498db; --orange: #e67e22; }
        * { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important; box-sizing: border-box; }
        body { background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .main-menu { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .menu-btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; background: #e2e8f0; font-weight: bold; color: var(--primary); }
        .menu-btn.active { background: var(--primary); color: white; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-val { font-size: 32px; font-weight: bold; color: var(--accent); }
        /* Khu vực Upload sửa lỗi */
        .upload-section { border: 3px dashed #bdc3c7; padding: 40px; text-align: center; border-radius: 10px; background: #fafbfc; cursor: pointer; transition: 0.3s; position: relative; }
        .upload-section:hover { border-color: var(--blue); background: #f0f7ff; }
        .upload-section * { pointer-events: none; } /* Đảm bảo click vào con cũng là click vào cha */
        #file-input { display: none; }
        .item-row { padding: 15px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 8px; width: 100%; text-align: left; }
        .item-row:hover { background: var(--primary); color: white; }
        .interactive-card { border: 2px solid #e2e8f0; border-radius: 12px; padding: 25px; background: #f8fafc; margin-top: 15px; text-align: center; }
        .vocab-main { font-size: 55px; font-weight: bold; color: #000; margin: 10px 0; }
        .vocab-main span { cursor: pointer; padding: 0 4px; border-radius: 4px; pointer-events: auto; }
        .vocab-main span:hover { background: #ffe082; }
        .vocab-py { font-size: 22px; color: #7f8c8d; }
        .vocab-vn { font-size: 26px; font-weight: bold; color: var(--accent); }
        .example-block { text-align: left; background: #fff; padding: 20px; border-radius: 8px; border-left: 5px solid var(--accent); margin-top: 20px; }
        .chip-pool, .drop-zone { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 55px; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
        .chip { padding: 8px 15px; background: #e2e8f0; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .chip.used { opacity: 0.3; pointer-events: none; }
        .btn-audio { background: var(--blue); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; margin: 5px; }
        .analysis-box { text-align: left; background: #fff8db; border-left: 5px solid #f1c40f; padding: 20px; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="main-menu">
        <button class="menu-btn active" id="nav-home" onclick="nav('home')">🏠 Trang Chủ & Học Mới</button>
        <button class="menu-btn" id="nav-review" onclick="nav('review')">🔄 Ôn Tập Hệ Thống</button>
        <button class="menu-btn" id="nav-test" onclick="nav('test')">📝 Làm Bài Kiểm Tra</button>
    </div>

    <div id="sec-home">
        <div class="stats-grid" id="stats-area"></div>
        <!-- Sửa lỗi: Input file để ngoài, khu vực div chỉ làm nhiệm vụ kích hoạt click -->
        <input type="file" id="file-input" accept=".pdf,.docx" onchange="handleFileUpload(this)">
        <div class="upload-section" id="upload-trigger">
            <span style="font-size: 50px;">📂</span>
            <p style="font-size: 18px; font-weight: bold;">Bước 1: Tải file bài học chuyên ngành (.pdf, .docx)</p>
            <p style="color: #666;">(Nhấp vào đây để chọn file từ máy tính của bạn)</p>
        </div>
        <div id="status" style="color:var(--success); font-weight:bold; margin-top:15px; text-align:center;"></div>
        
        <div id="workflow-skill-zone" class="hidden" style="margin-top:25px;">
            <h3>Bước 2: Chọn Kỹ Năng:</h3>
            <div class="stats-grid">
                <button class="menu-btn" style="background:#3498db; color:white;" onclick="selectSkill('listen')">🔊 Học Nghe</button>
                <button class="menu-btn" style="background:#e67e22; color:white;" onclick="selectSkill('speak')">🎙️ Học Nói</button>
                <button class="menu-btn" style="background:#9b59b6; color:white;" onclick="selectSkill('read')">📖 Học Đọc</button>
                <button class="menu-btn" style="background:#16a085; color:white;" onclick="selectSkill('write')">✍️ Học Viết</button>
            </div>
        </div>

        <div id="workflow-topic-zone" class="hidden" style="margin-top:25px;">
            <h3>Bước 3: Chọn Chủ Đề:</h3>
            <div id="workflow-topic-list"></div>
        </div>
    </div>

    <!-- CÁC SECTION KHÁC -->
    <div id="sec-review" class="hidden"><h3>Lịch sử học tập</h3><div id="review-list"></div></div>
    <div id="sec-test" class="hidden"><h3>Kiểm tra tổng hợp</h3><div id="test-topic-list"></div></div>

    <!-- STUDY ENGINE -->
    <div id="study-engine" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <button onclick="location.reload()" style="padding:5px 15px;">← Thoát</button>
            <h3 id="engine-title" style="margin:0"></h3>
            <strong id="engine-progress">0/0</strong>
        </div>
        <div class="interactive-card">
            <div id="display-area">
                <div class="vocab-main" id="v-main"></div>
                <div class="vocab-py" id="v-py"></div>
                <div class="vocab-vn" id="v-vn"></div>
                <button class="btn-audio" onclick="speakText(currentList[idx].cn)">🔊 Nghe Từ</button>
                <button class="btn-audio" style="background:var(--success)" onclick="speakText(currentList[idx].e_cn)">🔊 Nghe Câu</button>
            </div>

            <div id="ui-listen" class="hidden">
                <div class="drop-zone" id="l-drop"></div><div class="chip-pool" id="l-pool"></div>
                <div style="margin: 10px;">
                    <button class="menu-btn" style="background:var(--orange); color:white;" onclick="resetListen()">🔄 Làm lại</button>
                    <button class="menu-btn" style="background:var(--success); color:white;" onclick="checkListen()">✅ Nộp bài</button>
                </div>
                <div id="l-feedback" style="font-weight:bold; margin-top:10px;"></div>
            </div>

            <div id="example-area" class="example-block">
                <div id="e-main" class="vocab-main" style="font-size:24px; text-align:left;"></div>
                <div id="e-py" class="vocab-py" style="text-align:left;"></div>
                <div id="e-vn" class="vocab-vn" style="text-align:left; font-size:18px;"></div>
            </div>

            <div id="analysis-area" class="analysis-box hidden"></div>
            <button class="menu-btn" style="margin-top:20px; background:var(--primary); color:white; width:200px;" onclick="nextWord()">Tiếp theo →</button>
        </div>
    </div>
</div>

<script>
    // Dữ liệu chiết tự & bộ thủ tích hợp từ Sách
    const radicalsData = {
        "亻": "Bộ Nhân (người): Liên quan đến con người[cite: 2].",
        "女": "Bộ Nữ (phụ nữ): Tượng trưng cho phái yếu, gia đình[cite: 2].",
        "子": "Bộ Tử (con cái): Hình ảnh đứa trẻ quấn tã[cite: 2, 3].",
        "宀": "Bộ Miên (mái nhà): Nơi ở an cư, yên ổn (chữ AN 安)[cite: 2, 3].",
        "口": "Bộ Khẩu (miệng): Liên quan đến ăn uống, lời nói[cite: 2].",
        "力": "Bộ Lực (sức mạnh): Hình cái cày, biểu thị lao động (chữ LAO 劳)[cite: 2, 3]."
    };

    let db = JSON.parse(localStorage.getItem('zh_db_v9')) || [];
    let currentSkill = '', currentList = [], idx = 0, selectedChips = [];

    // FIX LỖI CLICK UPLOAD
    document.getElementById('upload-trigger').onclick = () => document.getElementById('file-input').click();

    function nav(s) {
        document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`nav-${s}`).classList.add('active');
        ['sec-home', 'sec-review', 'sec-test', 'study-engine'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(`sec-${s}`).classList.remove('hidden');
        if(s === 'home') renderHome();
    }

    function renderHome() {
        const area = document.getElementById('stats-area');
        area.innerHTML = `<div class="stat-card">Tổng từ vựng<br><span class="stat-val">${db.length}</span></div>
                          <div class="stat-card">Chủ đề<br><span class="stat-val">${new Set(db.map(d=>d.topic)).size}</span></div>`;
        if(db.length > 0) document.getElementById('workflow-skill-zone').classList.remove('hidden');
    }

    function handleFileUpload(input) {
        const file = input.files[0];
        if(!file) return;
        document.getElementById('status').innerText = "🔄 Đang xử lý file...";
        const reader = new FileReader();
        reader.onload = function(e) {
            if(file.name.endsWith('.docx')) mammoth.extractRawText({arrayBuffer: e.target.result}).then(r => processTxt(r.value));
            else pdfjsLib.getDocument(new Uint8Array(e.target.result)).promise.then(pdf => {
                let p = [];
                for(let i=1; i<=pdf.numPages; i++) p.push(pdf.getPage(i).then(pg => pg.getTextContent().then(c => c.items.map(m => m.str).join(" "))));
                Promise.all(p).then(t => processTxt(t.join("\n")));
            });
        };
        reader.readAsArrayBuffer(file);
    }

    function processTxt(txt) {
        const lines = txt.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let topic = "Chung", count = 0;
        for(let i=0; i<lines.length; i++) {
            if(/^\d+\./.test(lines[i])) topic = lines[i];
            if(/[\u4e00-\u9fa5]/.test(lines[i]) && !lines[i].includes("Từ vựng")) {
                let w = { cn: lines[i], py: lines[i+1]||"", vn: lines[i+2]||"", e_cn: lines[i+3]||"", e_py: lines[i+4]||"", e_vn: lines[i+5]||"", topic: topic, date: new Date().toLocaleDateString('vi-VN') };
                if(!db.some(x => x.cn === w.cn)) { db.push(w); count++; }
                i += 5;
            }
        }
        localStorage.setItem('zh_db_v9', JSON.stringify(db));
        document.getElementById('status').innerText = `✅ Đã nạp thành công ${count} từ mới!`;
        renderHome();
    }

    function selectSkill(skill) {
        currentSkill = skill;
        const container = document.getElementById('workflow-topic-list');
        container.innerHTML = "";
        [...new Set(db.map(d=>d.topic))].forEach(t => {
            let b = document.createElement('button'); b.className = "item-row";
            b.innerHTML = `📂 ${t} (${db.filter(x=>x.topic===t).length} từ)`;
            b.onclick = () => startStudy(t);
            container.appendChild(b);
        });
        document.getElementById('workflow-topic-zone').classList.remove('hidden');
    }

    function startStudy(topic) {
        currentList = db.filter(d => d.topic === topic); idx = 0;
        document.getElementById('sec-home').classList.add('hidden');
        document.getElementById('study-engine').classList.remove('hidden');
        loadWord();
    }

    function loadWord() {
        const w = currentList[idx];
        document.getElementById('engine-title').innerText = `${currentSkill.toUpperCase()} - ${w.topic}`;
        document.getElementById('engine-progress').innerText = `${idx+1}/${currentList.length}`;
        document.getElementById('v-main').innerHTML = w.cn.split("").map(c => `<span onclick="analyze('${c}')">${c}</span>`).join("");
        document.getElementById('v-py').innerText = w.py; document.getElementById('v-vn').innerText = w.vn;
        document.getElementById('e-main').innerHTML = w.e_cn.split("").map(c => `<span onclick="analyze('${c}')">${c}</span>`).join("");
        document.getElementById('e-py').innerText = w.e_py; document.getElementById('e-vn').innerText = w.e_vn;
        
        document.getElementById('ui-listen').classList.add('hidden');
        document.getElementById('analysis-area').classList.add('hidden');

        if(currentSkill === 'listen') {
            document.getElementById('ui-listen').classList.remove('hidden');
            document.getElementById('v-main').style.visibility = 'hidden';
            setupListen(w.e_cn);
        } else {
            document.getElementById('v-main').style.visibility = 'visible';
        }
    }

    function setupListen(sentence) {
        const pool = document.getElementById('l-pool'); const drop = document.getElementById('l-drop');
        pool.innerHTML = ""; drop.innerHTML = ""; selectedChips = [];
        let chars = sentence.split("").filter(c => !/[\s.,!?;。，！？]/.test(c));
        chars.sort(() => Math.random() - 0.5).forEach(c => {
            let chip = document.createElement('div'); chip.className = "chip"; chip.innerText = c;
            chip.onclick = () => { chip.classList.add('used'); let d = document.createElement('div'); d.className = "chip"; d.innerText = c; drop.appendChild(d); selectedChips.push(c); };
            pool.appendChild(chip);
        });
    }

    function checkListen() {
        const target = currentList[idx].e_cn.replace(/[\s.,!?;。，！？]/g, "");
        const fb = document.getElementById('l-feedback');
        if(selectedChips.join("") === target) { fb.innerHTML = "✅ CHÍNH XÁC!"; document.getElementById('v-main').style.visibility = 'visible'; }
        else fb.innerHTML = "❌ SAI RỒI! Thử lại nhé.";
    }

    function resetListen() { setupListen(currentList[idx].e_cn); document.getElementById('l-feedback').innerText = ""; }

    function analyze(char) {
        const box = document.getElementById('analysis-area');
        let radicalInfo = "";
        Object.keys(radicalsData).forEach(r => { if(char.includes(r)) radicalInfo += `<p>➔ ${radicalsData[r]}</p>`; });
        box.innerHTML = `<strong>Phân tích chữ: ${char}</strong>${radicalInfo || "<p>Dữ liệu chiết tự đang cập nhật.</p>"}`;
        box.classList.remove('hidden');
    }

    function speakText(t) { const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; window.speechSynthesis.speak(u); }
    function nextWord() { if(idx < currentList.length-1) { idx++; loadWord(); } else { alert("Xong!"); location.reload(); } }
</script>
</body>
</html>
