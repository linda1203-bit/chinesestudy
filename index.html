<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>HánStudy AI</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');

:root{

    --bg:#eef2f7;
    --card:#ffffff;
    --border:#d6dfeb;

    --blue:#3b82f6;
    --blue-dark:#22364d;

    --green:#10b981;
    --orange:#ff7a00;

    --text:#1e293b;
    --sub:#64748b;

    --shadow:
    0 10px 30px rgba(15,23,42,.06);
}

*{
    box-sizing:border-box;
}

body{

    margin:0;
    background:var(--bg);
    font-family:'Be Vietnam Pro',sans-serif;
    color:var(--text);

    padding:40px;
}

.container{

    max-width:1280px;
    margin:auto;

    background:#f8fafc;

    border:1px solid #d9e2ef;

    border-radius:34px;

    padding:26px;

    box-shadow:var(--shadow);
}

.hidden{
    display:none !important;
}

/* =========================
   NAVBAR
========================= */

.top-nav{

    display:flex;
    gap:14px;

    padding-bottom:20px;
    border-bottom:1px solid #d8e2ef;
}

.nav-btn{

    border:none;
    border-radius:18px;

    padding:16px 28px;

    font-size:18px;
    font-weight:700;

    cursor:pointer;

    background:white;
    color:#64748b;

    border:1px solid #cfd9e8;

    transition:.25s;
}

.nav-btn.active{

    background:#24364b;
    color:white;

    box-shadow:
    0 8px 20px rgba(36,54,75,.18);
}

/* =========================
   DASHBOARD
========================= */

.dashboard-grid{

    margin-top:34px;

    display:grid;

    grid-template-columns:
    1.2fr .8fr .8fr;

    gap:20px;
}

.upload-card{

    border:2px dashed #c8d5e6;

    border-radius:26px;

    min-height:190px;

    background:#f8fafc;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.25s;
}

.upload-card:hover{
    transform:translateY(-2px);
}

.upload-icon{
    font-size:54px;
}

.upload-title{

    margin-top:14px;

    font-size:32px;
    font-weight:800;
}

.upload-sub{

    margin-top:8px;

    color:#64748b;
    font-size:18px;
}

.stat-card{

    background:white;

    border:1px solid #d6dfeb;

    border-radius:26px;

    min-height:190px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;
}

.stat-number{

    font-size:72px;
    font-weight:800;

    color:#3b82f6;
}

.stat-label{

    margin-top:10px;

    font-size:22px;
    font-weight:700;

    color:#64748b;
}

/* =========================
   STATUS
========================= */

.status-success{

    margin-top:24px;

    font-size:34px;
    font-weight:700;
}

/* =========================
   STEP TITLE
========================= */

.step-title{

    margin-top:28px;
    margin-bottom:20px;

    font-size:38px;
    font-weight:800;
}

/* =========================
   SKILL BUTTONS
========================= */

.skill-grid{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:18px;
}

.skill-btn{

    border:none;

    border-radius:20px;

    padding:24px;

    background:white;

    border:1px solid #d7e0ec;

    cursor:pointer;

    font-size:22px;
    font-weight:700;

    transition:.25s;
}

.skill-btn:hover{
    transform:translateY(-2px);
}

.skill-btn.active{

    background:#eff6ff;

    border:2px solid #60a5fa;

    color:#2563eb;
}

/* =========================
   TOPIC LIST
========================= */

.topic-list{

    margin-top:20px;
}

.topic-card{

    width:100%;

    background:white;

    border:1px solid #d8e1ec;

    border-radius:22px;

    padding:24px 28px;

    margin-bottom:18px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    cursor:pointer;

    transition:.25s;
}

.topic-card:hover{

    transform:translateY(-2px);

    box-shadow:
    0 10px 25px rgba(15,23,42,.06);
}

.topic-title{

    font-size:30px;
    font-weight:700;
}

.topic-count{

    font-size:24px;
    font-weight:700;

    color:#1e293b;
}

/* =========================
   PREVIEW PAGE
========================= */

.preview-top{

    margin-top:24px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.back-btn{

    border:none;

    background:white;

    border:1px solid #d7e0ec;

    padding:18px 28px;

    border-radius:18px;

    font-size:20px;
    font-weight:600;

    cursor:pointer;
}

.preview-title{

    font-size:42px;
    font-weight:800;
}

.start-btn{

    border:none;

    background:#10b981;
    color:white;

    border-radius:18px;

    padding:20px 34px;

    font-size:24px;
    font-weight:700;

    cursor:pointer;
}

.preview-scroll{

    margin-top:26px;

    max-height:68vh;

    overflow:auto;

    padding-right:10px;
}

/* =========================
   VOCAB CARD
========================= */

.preview-card{

    background:white;

    border:1px solid #d9e2ef;

    border-radius:24px;

    padding:30px;

    margin-bottom:22px;
}

.preview-main{

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.preview-cn{

    font-size:60px;
    font-weight:800;
}

.preview-py{

    margin-top:10px;

    font-size:26px;

    color:#64748b;
}

.preview-vn{

    font-size:34px;
    font-weight:700;

    color:#ff7a00;
}

.preview-divider{

    margin:24px 0;

    height:1px;
    background:#dbe5f0;
}

.preview-ex-cn{

    font-size:34px;
    font-weight:700;
}

.preview-ex-py{

    margin-top:8px;

    font-size:24px;

    color:#64748b;
}

.preview-ex-vn{

    margin-top:10px;

    font-size:28px;

    color:#10b981;

    font-weight:600;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    .dashboard-grid{
        grid-template-columns:1fr;
    }

    .skill-grid{
        grid-template-columns:1fr 1fr;
    }

    .preview-top{
        flex-direction:column;
        gap:20px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="top-nav">
        <button class="nav-btn active" id="nav-home" onclick="changeMainTab('home')">

</div>

</button>

<button class="skill-btn" id="sk-tab-speak"

</div>

        <!-- TOPIC -->
        <div class="step-title">

</div>

<div id="workflow-topic-container-list"

    </div>

    <!-- PREVIEW -->
    <div id="sec-preview" class="hidden">

<div class="preview-top">

    <button class="back-btn"

        ← Trang chủ
    </button>

    <div class="preview-title"

    </div>

</div>

<div class="preview-scroll"

</div>

        <div id="e-vn-text"></div>

                Kiểm tra
            </button>

        </div>

        <!-- READ -->
        <div id="panel-read" class="hidden">

        </div>

        <div id="panel-listen" class="hidden">

        </div>

        <div id="panel-speak" class="hidden">

            <button id="mic-trigger-btn"

            </button>

        </div>

        <div id="test-topic-container-list"></div>

</div>

/* =========================

========================= */

let globalDatabase =
    JSON.parse(localStorage.getItem('zh_master_db')) || [];

/* =========================
   SAFE DOM
========================= */

function safeText(id,val){
    const el=document.getElementById(id);
    if(el) el.innerText=val;
}

function safeHTML(id,val){
    const el=document.getElementById(id);
    if(el) el.innerHTML=val;
}

/* =========================
   SPEECH
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let voiceRecognitionEngine = null;

if(SpeechRecognition){
    voiceRecognitionEngine = new SpeechRecognition();
    voiceRecognitionEngine.lang='zh-CN';
    voiceRecognitionEngine.continuous=false;
    voiceRecognitionEngine.interimResults=false;
}

/* =========================
   FILE UPLOAD
========================= */

function triggerUploadParser(input){

    const file = input.files[0];

    if(!file) return;

    safeText("status-msg","🔄 Đang xử lý file...");

    const reader = new FileReader();

    reader.onload = function(e){

        if(file.name.endsWith('.docx')){

            mammoth.extractRawText({
                arrayBuffer:e.target.result
            }).then(r=>{
                executeTextParserEngine(r.value);
            });

        }else if(file.name.endsWith('.pdf')){

            pdfjsLib.getDocument({
                data:new Uint8Array(e.target.result)
            }).promise.then(pdf=>{

                let p=[];

                for(let i=1;i<=pdf.numPages;i++){

                    p.push(
                        pdf.getPage(i).then(pg=>
                            pg.getTextContent().then(c=>
                                c.items.map(m=>m.str).join(' ')
                            )
                        )
                    );
                }

                Promise.all(p).then(t=>{
                    executeTextParserEngine(t.join('\n'));
                });
            });

        }else{

            executeTextParserEngine(e.target.result);

        }

    };

    if(file.name.endsWith('.txt')){
        reader.readAsText(file);
    }else{
        reader.readAsArrayBuffer(file);
    }
}

/* =========================
   PARSER
========================= */

function executeTextParserEngine(txt){

    const lines = txt
        .split('\n')
        .map(l=>l.trim())
        .filter(l=>l.length>0);

    let topic="Chung";
    let count=0;

    for(let i=0;i<lines.length;i++){

        if(lines[i].includes("TỪ VỰNG")){
            topic=lines[i];
            continue;
        }

        if(/[\u4e00-\u9fa5]/.test(lines[i])){

            let w = {
                cn:lines[i] || "",
                py:lines[i+1] || "",
                vn:lines[i+2] || "",
                ex_cn:lines[i+3] || "",
                ex_py:lines[i+4] || "",
                ex_vn:lines[i+5] || "",
                topic:topic
            };

            if(
                w.cn &&
                !globalDatabase.some(d=>d.cn===w.cn)
            ){
                globalDatabase.push(w);
                count++;
            }

            i+=5;
        }
    }

    localStorage.setItem(
        'zh_master_db',
        JSON.stringify(globalDatabase)
    );

    safeText(
        "status-msg",
        `✅ Đã nạp ${count} từ`
    );

    renderHomeDashboard();
}

/* =========================
   RADICAL AI
========================= */

function executeAIRadicalAnalyzer(char){

    const box =
        document.getElementById(
            'panel-radical-analysis'
        );

    let html="";

    let parts =
        AI_Decomposition_Matrix_Map[char] || [];

    if(parts.length>0){

        parts.forEach(p=>{

            if(TM_Radicals_Dict[p]){

                html+=
                `<p>
                    ➔ ${p} :
                    ${TM_Radicals_Dict[p]}
                 </p>`;
            }
        });

    }else{

        html="<p>Không có dữ liệu.</p>";
    }

    box.innerHTML=
    `
    <h3>🤖 Phân tích: ${char}</h3>
    ${html}
    `;

    box.classList.remove('hidden');
}

   READ

function buildFourMultipleChoicesOptions(correct){

    const box =
        document.getElementById(
            'rd-quiz-options-wrapper'
        );

    box.innerHTML="";

    let opts=[correct];

    let pool =
        globalDatabase.filter(
            w=>w.vn!==correct
        );

    while(opts.length<4 && pool.length>0){

        let r =
            pool[
                Math.floor(
                    Math.random()*pool.length
                )
            ].vn;

        if(!opts.includes(r)){
            opts.push(r);
        }
    }

    opts.sort(()=>Math.random()-0.5);

    opts.forEach(opt=>{

        let b=document.createElement('button');

        b.className='quiz-option-btn';

        b.innerText=opt;

        b.onclick=()=>{
            document
                .getElementById('reveal-card-zone')
                .classList.remove('hidden');
        };

        box.appendChild(b);
    });
}

   LISTEN

function buildListenPuzzleLayout(sentence){

    puzzleSelectedChips=[];

    const pool =
        document.getElementById(
            'l-puzzle-pool'
        );

    const drop =
        document.getElementById(
            'l-puzzle-drop'
        );

    pool.innerHTML="";
    drop.innerHTML="";

    let chips =
        sentence
            .split("")
            .filter(c=>!/[\s]/.test(c));

    chips.sort(()=>Math.random()-0.5);

    chips.forEach(c=>{

        let div=document.createElement('div');

        div.className='puzzle-chip';

        div.innerText=c;

        div.onclick=()=>{

            div.classList.add('used');

            let d=document.createElement('div');

            d.className='puzzle-chip';

            d.innerText=c;

            drop.appendChild(d);

            puzzleSelectedChips.push(c);
        };

        pool.appendChild(div);
    });
}

        <span>📋 ${t}</span>
        <span>Bắt đầu →</span>
        `;

        r.onclick=()=>buildTestEngine(t);

        container.appendChild(r);
    });
}

function buildTestEngine(scope){

    let pool=
        globalDatabase.filter(
            d=>d.topic===scope
        );

    currentWords=
        pool.sort(()=>Math.random()-0.5)
        .slice(0,10);

    testIdx=0;
    testScore=0;

    document
        .querySelectorAll('.tab-pane-view')
        .forEach(id=>id.classList.add('hidden'));

    document
        .getElementById('test-engine-board')
        .classList.remove('hidden');

    loadTestQ();
}

function loadTestQ(){

    let q=currentWords[testIdx];

    document
        .getElementById(
            'test-question-content-box'
        ).innerHTML=
        `
        <h2>
            ${testIdx+1}.
            Nghĩa của ${q.cn} là gì?
        </h2>

        <input
            id="t-ans"
            placeholder="Nhập nghĩa..."
        >

        <button onclick="executeTestAnswerVerification()">
            Trả lời
        </button>
        `;
}

function executeTestAnswerVerification(){

    let q=currentWords[testIdx];

    let ans=
        document
            .getElementById('t-ans')
            .value
            .trim()
            .toLowerCase();

    if(ans===q.vn.toLowerCase()){
        testScore++;
    }

    if(testIdx<currentWords.length-1){

        testIdx++;

        loadTestQ();

    }else{

        alert(
            `🎉 Kết quả:
            ${testScore}/${currentWords.length}`
        );

        location.reload();
    }
}

function changeMainTab(tabName){

    document
        .querySelectorAll('.nav-btn')
        .forEach(b=>b.classList.remove('active'));

    document
        .querySelectorAll('.tab-pane-view')
        .forEach(p=>p.classList.add('hidden'));

    document
        .getElementById('study-engine-board')
        .classList.add('hidden');

    document
        .getElementById('test-engine-board')
        .classList.add('hidden');

    document
        .getElementById(`nav-${tabName}`)
        .classList.add('active');

    document
        .getElementById(`sec-${tabName}`)
        .classList.remove('hidden');

    if(tabName==='home'){
        renderHomeDashboard();
    }

    if(tabName==='test'){
        renderTestDashboard();
    }
}

renderHomeDashboard();

</script>
