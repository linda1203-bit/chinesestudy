<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>HánStudy AI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');

:root{
    --bg:#eef2f7;
    --card:#ffffff;
    --border:#d6dfeb;

    --blue:#3b82f6;
    --green:#10b981;
    --orange:#ff7a00;

    --text:#1e293b;
    --sub:#64748b;

    --shadow:
    0 10px 30px rgba(15,23,42,.06);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    font-family:'Be Vietnam Pro',sans-serif;
    color:var(--text);
    padding:40px;
}

.container{
    max-width:1300px;
    margin:auto;

    background:#f8fafc;

    border:1px solid #d9e2ef;
    border-radius:34px;

    padding:26px;

    box-shadow:var(--shadow);
}

.hidden{
    display:none !important;
}

/* =========================
   NAVBAR
========================= */

.top-nav{
    display:flex;
    gap:14px;

    padding-bottom:20px;
    border-bottom:1px solid #d8e2ef;
}

.nav-btn{
    border:none;
    border-radius:18px;

    padding:16px 28px;

    font-size:18px;
    font-weight:700;

    cursor:pointer;

    background:white;
    color:#64748b;

    border:1px solid #cfd9e8;

    transition:.25s;
}

.nav-btn.active{
    background:#24364b;
    color:white;
}

/* =========================
   DASHBOARD
========================= */

.dashboard-grid{
    margin-top:34px;

    display:grid;

    grid-template-columns:
    1.2fr .8fr .8fr;

    gap:20px;
}

.upload-card{
    border:2px dashed #c8d5e6;

    border-radius:26px;

    min-height:200px;

    background:#f8fafc;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.25s;
}

.upload-card:hover{
    transform:translateY(-2px);
}

.upload-icon{
    font-size:58px;
}

.upload-title{
    margin-top:14px;

    font-size:32px;
    font-weight:800;
}

.upload-sub{
    margin-top:8px;

    color:#64748b;
    font-size:18px;
}

.stat-card{
    background:white;

    border:1px solid #d6dfeb;
    border-radius:26px;

    min-height:200px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;
}

.stat-number{
    font-size:72px;
    font-weight:800;
    color:#3b82f6;
}

.stat-label{
    margin-top:10px;

    font-size:22px;
    font-weight:700;

    color:#64748b;
}

/* =========================
   SKILL
========================= */

.step-title{
    margin-top:34px;
    margin-bottom:20px;

    font-size:38px;
    font-weight:800;
}

.skill-grid{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:18px;
}

.skill-btn{
    border:none;

    border-radius:20px;

    padding:24px;

    background:white;

    border:1px solid #d7e0ec;

    cursor:pointer;

    font-size:22px;
    font-weight:700;

    transition:.25s;
}

.skill-btn.active{
    background:#eff6ff;
    border:2px solid #60a5fa;
    color:#2563eb;
}

/* =========================
   TOPIC
========================= */

.topic-list{
    margin-top:24px;
}

.topic-card{
    width:100%;

    background:white;

    border:1px solid #d8e1ec;

    border-radius:22px;

    padding:24px 28px;

    margin-bottom:18px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    cursor:pointer;
}

.topic-title{
    font-size:30px;
    font-weight:700;
}

.topic-count{
    font-size:22px;
    font-weight:700;
}

/* =========================
   PREVIEW
========================= */

.preview-top{
    margin-top:24px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.preview-title{
    font-size:42px;
    font-weight:800;
}

.back-btn,
.start-btn{
    border:none;

    border-radius:18px;

    padding:18px 28px;

    font-size:20px;
    font-weight:700;

    cursor:pointer;
}

.back-btn{
    background:white;
    border:1px solid #d7e0ec;
}

.start-btn{
    background:#10b981;
    color:white;
}

.preview-scroll{
    margin-top:28px;

    max-height:70vh;
    overflow:auto;

    padding-right:10px;
}

.preview-card{
    background:white;

    border:1px solid #d9e2ef;

    border-radius:24px;

    padding:30px;

    margin-bottom:22px;
}

.preview-main{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.preview-cn{
    font-size:60px;
    font-weight:800;
}

.preview-py{
    margin-top:10px;

    font-size:26px;
    color:#64748b;
}

.preview-vn{
    font-size:34px;
    font-weight:700;
    color:#ff7a00;
}

.preview-divider{
    margin:24px 0;

    height:1px;
    background:#dbe5f0;
}

.preview-ex-cn{
    font-size:34px;
    font-weight:700;
}

.preview-ex-py{
    margin-top:8px;

    font-size:24px;
    color:#64748b;
}

.preview-ex-vn{
    margin-top:10px;

    font-size:28px;
    color:#10b981;
}

/* =========================
   STUDY
========================= */

#study-engine-board{
    margin-top:30px;
}

.zh-main{
    font-size:64px;
    font-weight:800;
    margin-bottom:10px;
}

.zh-main span{
    cursor:pointer;
    transition:.2s;
}

.zh-main span:hover{
    color:#3b82f6;
}

#v-py-text,
#e-py-text{
    color:#64748b;
    font-size:24px;
    margin-bottom:14px;
}

#v-vn-text,
#e-vn-text{
    font-size:30px;
    font-weight:700;
    color:#ff7a00;
    margin-bottom:18px;
}

.quiz-option-btn{
    display:block;
    width:100%;

    margin-bottom:12px;

    padding:18px;

    border:none;

    border-radius:16px;

    font-size:22px;
    font-weight:700;

    cursor:pointer;

    background:white;
    border:1px solid #d7e0ec;
}

.puzzle-chip{
    display:inline-block;

    padding:12px 18px;
    margin:8px;

    background:white;

    border:1px solid #cfd9e8;
    border-radius:14px;

    font-size:28px;
    font-weight:700;

    cursor:pointer;
}

.puzzle-chip.used{
    opacity:.35;
}

.radical-pane{
    margin-top:30px;

    background:white;

    border:1px solid #d7e0ec;

    border-radius:22px;

    padding:24px;
}

.radical-pane h3{
    margin-top:0;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    .dashboard-grid{
        grid-template-columns:1fr;
    }

    .skill-grid{
        grid-template-columns:1fr 1fr;
    }

    .preview-top{
        flex-direction:column;
        gap:20px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- NAV -->

    <div class="top-nav">

        <button
            class="nav-btn active"
            id="nav-home"
            onclick="changeMainTab('home')">
            🏠 Trang Chủ
        </button>

        <button
            class="nav-btn"
            id="nav-test"
            onclick="changeMainTab('test')">
            📝 Kiểm Tra
        </button>

    </div>

    <!-- HOME -->

    <div id="sec-home" class="tab-pane-view">

        <div class="dashboard-grid">

            <button
                class="upload-card"
                onclick="document.getElementById('file-input').click()">

                <div class="upload-icon">📁</div>

                <div class="upload-title">
                    Tải lên tài liệu
                </div>

                <div class="upload-sub">
                    PDF / DOCX / TXT
                </div>

            </button>

            <div class="stat-card">

                <div
                    class="stat-number"
                    id="count-vocab">
                    0
                </div>

                <div class="stat-label">
                    TỪ VỰNG
                </div>

            </div>

            <div class="stat-card">

                <div
                    class="stat-number"
                    id="count-topic">
                    0
                </div>

                <div class="stat-label">
                    CHỦ ĐỀ
                </div>

            </div>

        </div>

        <input
            type="file"
            id="file-input"
            class="hidden"
            accept=".pdf,.docx,.txt"
            onchange="triggerUploadParser(this)"
        >

        <div
            id="status-msg"
            style="
            margin-top:20px;
            font-size:28px;
            font-weight:700;
            ">
        </div>

        <!-- SKILL -->

        <div
            id="workflow-skill-section"
            class="hidden">

            <div class="step-title">
                ⚡ Bước 1: Chọn kỹ năng
            </div>

            <div class="skill-grid">

                <button
                    class="skill-btn"
                    id="sk-tab-write"
                    onclick="toggleWorkflowSkill('write')">

                    ✍️ Luyện Viết

                </button>

                <button
                    class="skill-btn"
                    id="sk-tab-read"
                    onclick="toggleWorkflowSkill('read')">

                    📖 Luyện Đọc

                </button>

                <button
                    class="skill-btn"
                    id="sk-tab-listen"
                    onclick="toggleWorkflowSkill('listen')">

                    🔊 Luyện Nghe

                </button>

                <button
                    class="skill-btn"
                    id="sk-tab-speak"
                    onclick="toggleWorkflowSkill('speak')">

                    🎤 Luyện Nói

                </button>

            </div>

            <div class="step-title">
                📂 Bước 2: Chọn chủ đề
            </div>

            <div
                id="workflow-topic-container-list"
                class="topic-list">
            </div>

        </div>

    </div>

    <!-- PREVIEW -->

    <div
        id="sec-preview"
        class="hidden">

        <div class="preview-top">

            <button
                class="back-btn"
                onclick="activateLearningWorkflow()">

                ← Trang chủ

            </button>

            <div
                class="preview-title"
                id="preview-heading-title">
            </div>

            <button
                class="start-btn"
                onclick="initStudyEngineView()">

                🚀 Học ngay

            </button>

        </div>

        <div
            class="preview-scroll"
            id="preview-cards-scroller">
        </div>

    </div>

    <!-- STUDY -->

    <div
        id="study-engine-board"
        class="hidden">

        <h2 id="engine-header-title"></h2>

        <div id="engine-progress-counter"></div>

        <div
            id="v-main-text"
            class="zh-main">
        </div>

        <div id="v-py-text"></div>
        <div id="v-vn-text"></div>

        <hr>

        <div
            id="e-main-text"
            class="zh-main">
        </div>

        <div id="e-py-text"></div>
        <div id="e-vn-text"></div>

        <!-- WRITE -->

        <div
            id="panel-write"
            class="hidden">

            <input
                type="text"
                id="write-answer">

            <button
                onclick="verifyWriteAnswer()">

                Kiểm tra

            </button>

        </div>

        <!-- READ -->

        <div
            id="panel-read"
            class="hidden">

            <div
                id="rd-quiz-options-wrapper">
            </div>

        </div>

        <!-- LISTEN -->

        <div
            id="panel-listen"
            class="hidden">

            <div id="l-puzzle-pool"></div>

            <hr>

            <div id="l-puzzle-drop"></div>

            <button
                onclick="verifyListenPuzzle()">

                Kiểm tra

            </button>

        </div>

        <!-- SPEAK -->

        <div
            id="panel-speak"
            class="hidden">

            <button
                id="mic-trigger-btn"
                onclick="activateVoiceRecognition()">

                🎤 Bấm nói

            </button>

            <div id="sp-feedback-msg"></div>

        </div>

        <!-- NEXT -->

        <div
            id="reveal-card-zone"
            class="hidden">

            <button
                onclick="shiftNextWord()">

                ➡ Từ tiếp theo

            </button>

        </div>

        <!-- RADICAL -->

        <div
            id="panel-radical-analysis"
            class="radical-pane hidden">
        </div>

    </div>

    <!-- TEST -->

    <div
        id="test-engine-board"
        class="hidden">

        <div
            id="test-topic-container-list">
        </div>

        <div
            id="test-question-content-box">
        </div>

    </div>

</div>

/* =========================

========================= */

let globalDatabase =
JSON.parse(
    localStorage.getItem('zh_master_db')
) || [];

let currentWords = [];
let activeIdx = 0;

let currentActiveTopicName = "";

let puzzleSelectedChips = [];

let currentActiveSentenceTarget = "";

/* =========================
   SAFE DOM
========================= */

function safeText(id,val){

    const el=document.getElementById(id);

    if(el){
        el.innerText=val;
    }
}

function safeHTML(id,val){

    const el=document.getElementById(id);

    if(el){
        el.innerHTML=val;
    }
}

   SPEECH
========================= */

    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let voiceRecognitionEngine = null;

/* =========================
   FILE UPLOAD
========================= */

function triggerUploadParser(input){

    const file = input.files[0];

    if(!file) return;

    safeText(
        "status-msg",
        "🔄 Đang xử lý file..."
    );

    const reader = new FileReader();

    reader.onload = function(e){

        if(file.name.endsWith('.docx')){

            mammoth.extractRawText({
                arrayBuffer:e.target.result
            }).then(result=>{

                executeTextParserEngine(
                    result.value
                );

            });

        }

        else if(file.name.endsWith('.pdf')){

            pdfjsLib.getDocument({
                data:new Uint8Array(
                    e.target.result
                )
            }).promise.then(pdf=>{

                let pages=[];

                for(
                    let i=1;
                    i<=pdf.numPages;
                    i++
                ){

                    pages.push(

                        pdf.getPage(i)
                        .then(page=>

                            page.getTextContent()
                            .then(content=>

                                content.items
                                .map(x=>x.str)
                                .join(' ')

                            )

                        )

                    );
                }

                Promise.all(pages)
                .then(allText=>{

                    executeTextParserEngine(
                        allText.join('\n')
                    );

                });

            });

        }

        else{

            executeTextParserEngine(
                e.target.result
            );

        }

    };

    if(file.name.endsWith('.txt')){

        reader.readAsText(file);

    }else{

        reader.readAsArrayBuffer(file);

    }
}

/* =========================
   TEXT PARSER
========================= */

function executeTextParserEngine(txt){

    const lines = txt
    .split('\n')
    .map(l=>l.trim())
    .filter(l=>l.length>0);

    let topic="Chung";

    let addedCount=0;

    for(let i=0;i<lines.length;i++){

        const line=lines[i];

        /* detect topic */

        if(
            line.includes("TỪ VỰNG") ||
            line.includes("CHỦ ĐỀ") ||
            line.includes("BÀI")
        ){

            topic=line;

            continue;
        }

        /* detect chinese */

        if(/[\u4e00-\u9fa5]/.test(line)){

            let item={

                cn:line || "",

                py:lines[i+1] || "",

                vn:lines[i+2] || "",

                ex_cn:lines[i+3] || "",

                ex_py:lines[i+4] || "",

                ex_vn:lines[i+5] || "",

                topic:topic

            };

            const existed =
                globalDatabase.some(
                    d=>d.cn===item.cn
                );

            if(!existed){

                globalDatabase.push(item);

                addedCount++;
            }

            i+=5;
        }
    }

    localStorage.setItem(
        'zh_master_db',
        JSON.stringify(globalDatabase)
    );

    safeText(
        "status-msg",
        `✅ Đã nạp ${addedCount} từ mới`
    );

    renderHomeDashboard();
}

    container.innerHTML="";

    const topics =
    [...new Set(
        globalDatabase.map(d=>d.topic)
    )];

    topics.forEach(topic=>{

        const count =
        globalDatabase.filter(
            d=>d.topic===topic
        ).length;

        const btn =
        document.createElement('button');

        btn.className='topic-card';

        btn.innerHTML=
        `
        <div class="topic-title">
            📂 ${topic}
        </div>

        <div class="topic-count">
            ${count} từ
        </div>
        `;

        btn.onclick=()=>{

            currentActiveTopicName =

            currentWords =
            globalDatabase.filter(
                d=>d.topic===topic
            );

            if(activeSkillMode!==""){

                initStudyEngineView();

            }else{

                renderTopicPreviewMode(
                    topic
                );
            }
        };

        container.appendChild(btn);

    });

}

/* =========================

========================= */

function executeAIRadicalAnalyzer(char){

    const panel =
    document.getElementById(
        'panel-radical-analysis'
    );

    let html="";

    const parts =
    AI_Decomposition_Matrix_Map[
        char
    ] || [];

    if(parts.length>0){

        parts.forEach(part=>{

            if(
                TM_Radicals_Dict[part]
            ){

                html +=
                `
                <p>

                    ➔ <b>${part}</b>

                    :
                    ${TM_Radicals_Dict[part]}

                </p>
                `;

            }

        });

    }

    else{

        html=
        `
        <p>
            Không có dữ liệu phân tích.
        </p>
        `;
    }

    panel.innerHTML=
    `
    <h3>
        🤖 Phân tích chữ:
        ${char}
    </h3>

    ${html}
    `;

    panel.classList.remove('hidden');

}

/* =========================================================
STUDY ENGINE
========================================================= */

function initStudyEngineView(){

    if(currentWords.length===0){
        return;
    }

    activeIdx=0;

    document
    .querySelectorAll(".tab-pane-view")
    .forEach(el=>{
        el.classList.add("hidden");
    });

    document
    .getElementById("study-engine-board")
    .classList.remove("hidden");

    refreshEngineCardLayoutData();
}

function refreshEngineCardLayoutData(){

    const w=currentWords[activeIdx];

    safeText(
        "engine-header-title",
        `Học ${activeSkillMode.toUpperCase()}`
    );

    safeText(
        "engine-progress-counter",
        `${activeIdx+1}/${currentWords.length}`
    );

    safeHTML(
        "v-main-text",
        buildChineseClickable(w.cn)
    );

    safeText("v-py-text",w.py || "");
    safeText("v-vn-text",w.vn || "");

    safeHTML(
        "e-main-text",
        buildChineseClickable(w.ex_cn)
    );

    safeText("e-py-text",w.ex_py || "");
    safeText("e-vn-text",w.ex_vn || "");

    hideAllStudyPanels();

    if(activeSkillMode==="write"){

        document
        .getElementById("panel-write")
        .classList.remove("hidden");
    }

    if(activeSkillMode==="read"){

        document
        .getElementById("panel-read")
        .classList.remove("hidden");

        buildFourMultipleChoicesOptions(w.vn);
    }

    if(activeSkillMode==="listen"){

        document
        .getElementById("panel-listen")
        .classList.remove("hidden");

        currentActiveSentenceTarget =
        w.ex_cn || "";

        buildListenPuzzleLayout(
            currentActiveSentenceTarget
        );
    }

    if(activeSkillMode==="speak"){

        document
        .getElementById("panel-speak")
        .classList.remove("hidden");
    }

    bindChineseCharEvents();
}

function buildChineseClickable(text){

    if(!text) return "";

    return text
    .split("")
    .map(ch=>{

        if(/[\u4e00-\u9fa5]/.test(ch)){

            return `
            <span class="zh-char">
                ${ch}
            </span>
            `;
        }

        return ch;

    }).join("");
}

function hideAllStudyPanels(){

    [
        "panel-write",
        "panel-read",
        "panel-listen",
        "panel-speak",
        "reveal-card-zone",
        "panel-radical-analysis"
    ]
    .forEach(id=>{

        const el=document.getElementById(id);

        if(el){
            el.classList.add("hidden");
        }
    });
}

/* =========================================================
CLICK CHARACTER
========================================================= */

function bindChineseCharEvents(){

    const chars =
    document.querySelectorAll(".zh-char");

    chars.forEach(el=>{

        el.onclick=()=>{

            executeAIRadicalAnalyzer(
                el.innerText
            );
        };
    });
}

/* =========================================================
RADICAL ANALYZER
========================================================= */

function executeAIRadicalAnalyzer(char){

    const box =
    document.getElementById(
        "panel-radical-analysis"
    );

    let html="";

    let parts =
    AI_Decomposition_Matrix_Map[char] || [];

    if(parts.length===0){

        html=`
        <p>
        Không có dữ liệu phân tích.
        </p>
        `;

    }else{

        parts.forEach(part=>{

            html+=`
            <div class="radical-row">

                <div class="radical-char">
                    ${part}
                </div>

                <div class="radical-desc">
                    ${
                        TM_Radicals_Dict[part]
                        || "Không có mô tả"
                    }
                </div>

            </div>
            `;
        });
    }

    box.innerHTML=`

    <h3>
    🤖 Phân tích chữ:
    ${char}
    </h3>

    ${html}

    `;

    box.classList.remove("hidden");
}

PART 6 — TEST MODE + NAVIGATION + INIT
DÁN TIẾP NGAY SAU PART 5
========================================================= -->

<script>

/* =========================================================
TEST VARIABLES
========================================================= */

let testIdx = 0;
let testScore = 0;

/* =========================================================
TEST DASHBOARD
========================================================= */

function renderTestDashboard(){

    const container =
    document.getElementById(
        "test-topic-container-list"
    );

    container.innerHTML="";

    const topics = [
        ...new Set(
            globalDatabase.map(d=>d.topic)
        )
    ];

    topics.forEach(topic=>{

        const btn =
        document.createElement("button");

        btn.className =
        "topic-card";

        btn.innerHTML=`

        <div>

            <div class="topic-title">
                📝 ${topic}
            </div>

            <div class="topic-sub">
                ${
                    globalDatabase.filter(
                        d=>d.topic===topic
                    ).length
                } từ vựng
            </div>

        </div>

        <div class="topic-arrow">
            ➜
        </div>

        `;

        btn.onclick=()=>{

            buildTestEngine(topic);
        };

        container.appendChild(btn);
    });
}

/* =========================================================
BUILD TEST
========================================================= */

function buildTestEngine(topic){

    currentWords =
    globalDatabase
    .filter(d=>d.topic===topic)
    .sort(()=>Math.random()-0.5)
    .slice(0,10);

    testIdx=0;
    testScore=0;

    document
    .querySelectorAll(".tab-pane-view")
    .forEach(el=>{
        el.classList.add("hidden");
    });

    document
    .getElementById("test-engine-board")
    .classList.remove("hidden");

    loadTestQuestion();
}

/* =========================================================
LOAD TEST QUESTION
========================================================= */

function loadTestQuestion(){

    const q =
    currentWords[testIdx];

    const box =
    document.getElementById(
        "test-question-content-box"
    );

    box.innerHTML=`

    <div class="test-box">

        <div class="test-progress">

            Câu ${testIdx+1}
            / ${currentWords.length}

        </div>

        <div class="test-question">

            Nghĩa của:

            <div class="test-cn">
                ${q.cn}
            </div>

        </div>

        <input
            id="t-ans"
            class="test-input"
            placeholder="Nhập nghĩa tiếng Việt..."
        >

        <button
            class="test-submit-btn"
            onclick="
            executeTestAnswerVerification()
            "
        >
            Kiểm tra
        </button>

    </div>

    `;
}

/* =========================================================
VERIFY TEST
========================================================= */

function executeTestAnswerVerification(){

    const q =
    currentWords[testIdx];

    const ans =
    document
    .getElementById("t-ans")
    .value
    .trim()
    .toLowerCase();

    const correct =
    q.vn
    .trim()
    .toLowerCase();

    if(ans===correct){

        testScore++;

        alert("✅ Chính xác");

    }else{

        alert(`
❌ Sai rồi

Đáp án:
${q.vn}
        `);
    }

    if(
        testIdx <
        currentWords.length-1
    ){

        testIdx++;

        loadTestQuestion();

    }else{

        renderFinalTestResult();
    }
}

/* =========================================================
FINAL RESULT
========================================================= */

function renderFinalTestResult(){

    const percent =
    Math.round(
        (testScore/currentWords.length)*100
    );

    document
    .getElementById(
        "test-question-content-box"
    )
    .innerHTML=`

    <div class="final-score-box">

        <div class="final-score-title">
            🎉 Hoàn thành bài kiểm tra
        </div>

        <div class="final-score-number">
            ${testScore}
            /
            ${currentWords.length}
        </div>

        <div class="final-score-percent">
            ${percent}%
        </div>

        <button
            class="restart-btn"
            onclick="changeMainTab('home')"
        >
            ← Về trang chủ
        </button>

    </div>

    `;
}

/* =========================================================
NAVIGATION
========================================================= */

function changeMainTab(tabName){

    document
    .querySelectorAll(".nav-btn")
    .forEach(btn=>{

        btn.classList.remove("active");
    });

    document
    .querySelectorAll(".tab-pane-view")
    .forEach(page=>{

        page.classList.add("hidden");
    });

    const studyBoard =
    document.getElementById(
        "study-engine-board"
    );

    if(studyBoard){

        studyBoard.classList.add("hidden");
    }

    const testBoard =
    document.getElementById(
        "test-engine-board"
    );

    if(testBoard){

        testBoard.classList.add("hidden");
    }

    document
    .getElementById(`nav-${tabName}`)
    .classList.add("active");

    document
    .getElementById(`sec-${tabName}`)
    .classList.remove("hidden");

    if(tabName==="home"){

        renderHomeDashboard();
    }

    if(tabName==="test"){

        renderTestDashboard();
    }
}

/* =========================================================
INIT
========================================================= */

renderHomeDashboard();

</script>
