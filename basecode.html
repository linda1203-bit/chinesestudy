<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Học Tiếng Trung</title>
    <style>
        :root {
            --primary-color: #e74c3c;
            --secondary-color: #2c3e50;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 30px;
        }

        h1 { margin-bottom: 5px; }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #7f8c8d;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }

        .panel { display: none; }
        .panel.active { display: block; }

        /* Flashcard Styles */
        .card-container {
            perspective: 1000px;
            margin: 40px auto;
            width: 300px;
            height: 200px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .front {
            background-color: var(--primary-color);
            color: white;
        }

        .front .chinese { font-size: 64px; font-weight: bold; }

        .back {
            background-color: #fff;
            color: var(--secondary-color);
            border: 2px solid var(--primary-color);
            transform: rotateY(180deg);
        }

        .back .pinyin { font-size: 24px; color: #7f8c8d; margin-bottom: 10px; }
        .back .meaning { font-size: 28px; font-weight: bold; }

        .controls {
            display: flex;
            justify-content: space-between;
            width: 300px;
            margin: 0 auto;
        }

        button.btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button.btn:hover { opacity: 0.9; }

        /* Quiz Styles */
        .quiz-box { text-align: center; }
        .quiz-question { font-size: 48px; margin-bottom: 20px; }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #fff;
            border: 2px solid #bdc3c7;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover { background: #f0f0f0; }
        #quiz-feedback { font-weight: bold; font-size: 18px; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>Học Tiếng Trung Mỗi Ngày</h1>
        <p>Học thông minh - Nhớ tự nhiên</p>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('flashcard')">Thẻ Ghi Nhớ</button>
            <button class="tab-btn" onclick="switchTab('quiz')">Trắc Nghiệm</button>
        </div>

        <div id="flashcard-panel" class="panel active">
            <div class="card-container" onclick="toggleFlip()">
                <div id="card" class="flashcard">
                    <div class="front">
                        <div class="chinese" id="fc-chinese">你好</div>
                    </div>
                    <div class="back">
                        <div class="pinyin" id="fc-pinyin">nǐ hǎo</div>
                        <div class="meaning" id="fc-meaning">Xin chào</div>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button class="btn" onclick="prevCard()">Trước</button>
                <button class="btn" onclick="nextCard()">Tiếp theo</button>
            </div>
        </div>

        <div id="quiz-panel" class="panel">
            <div class="quiz-box">
                <div class="quiz-question" id="quiz-q">你好</div>
                <div class="options-grid" id="quiz-options">
                    </div>
                <div id="quiz-feedback"></div>
                <button class="btn" id="next-quiz-btn" style="display:none; margin: 20px auto 0;" onclick="generateQuiz()">Câu tiếp theo</button>
            </div>
        </div>
    </div>

    <script>
        // Dữ liệu từ vựng (Bạn có thể thêm từ mới vào đây)
        const wordList = [
            { chinese: "你好", pinyin: "nǐ hǎo", meaning: "Xin chào" },
            { chinese: "谢谢", pinyin: "xièxie", meaning: "Cảm ơn" },
            { chinese: "再见", pinyin: "zàijiàn", meaning: "Tạm biệt" },
            { chinese: "中国", pinyin: "Zhōngguó", meaning: "Trung Quốc" },
            { chinese: "学习", pinyin: "xuéxí", meaning: "Học tập" },
            { chinese: "咖啡", pinyin: "kāfēi", meaning: "Cà phê" },
            { chinese: "苹果", pinyin: "píngguǒ", meaning: "Quả táo" },
            { chinese: "猫", pinyin: "māo", meaning: "Con mèo" }
        ];

        let currentCardIndex = 0;

        // Chuyển Đổi Tab
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));

            if(tabName === 'flashcard') {
                document.querySelector('[onclick="switchTab(\'flashcard\')"]').classList.add('active');
                document.getElementById('flashcard-panel').classList.add('active');
            } else {
                document.querySelector('[onclick="switchTab(\'quiz\')"]').classList.add('active');
                document.getElementById('quiz-panel').classList.add('active');
                generateQuiz();
            }
        }

        // Logic Flashcard
        function updateFlashcard() {
            const card = document.getElementById('card');
            card.classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('fc-chinese').innerText = wordList[currentCardIndex].chinese;
                document.getElementById('fc-pinyin').innerText = wordList[currentCardIndex].pinyin;
                document.getElementById('fc-meaning').innerText = wordList[currentCardIndex].meaning;
            }, 150);
        }

        function toggleFlip() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % wordList.length;
            updateFlashcard();
        }

        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + wordList.length) % wordList.length;
            updateFlashcard();
        }

        // Logic Trắc Nghiệm
        let currentCorrectAnswer = "";

        function generateQuiz() {
            document.getElementById('quiz-feedback').innerText = "";
            document.getElementById('next-quiz-btn').style.display = "none";
            
            // Lấy ngẫu nhiên 1 từ làm câu hỏi
            const correctWord = wordList[Math.floor(Math.random() * wordList.length)];
            document.getElementById('quiz-q').innerText = correctWord.chinese;
            currentCorrectAnswer = correctWord.meaning;

            // Tạo danh sách câu trả lời nhiễu
            let options = [correctWord.meaning];
            while(options.length < 4 && options.length < wordList.length) {
                let randomMeaning = wordList[Math.floor(Math.random() * wordList.length)].meaning;
                if(!options.includes(randomMeaning)) {
                    options.push(randomMeaning);
                }
            }
            
            // Trộn thứ tự đáp án
            options.sort(() => Math.random() - 0.5);

            // Hiển thị đáp án lên giao diện
            const optionsGrid = document.getElementById('quiz-options');
            optionsGrid.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, answer) {
            const feedback = document.getElementById('quiz-feedback');
            const allButtons = document.querySelectorAll('.option-btn');
            
            // Vô hiệu hóa các nút sau khi chọn
            allButtons.forEach(btn => btn.disabled = true);

            if(answer === currentCorrectAnswer) {
                selectedBtn.style.background = "#2ecc71";
                selectedBtn.style.color = "white";
                feedback.innerText = "Chính xác! 🎉";
                feedback.style.color = "#2ecc71";
            } else {
                selectedBtn.style.background = "#e74c3c";
                selectedBtn.style.color = "white";
                feedback.innerText = `Sai rồi! Đáp án đúng là: ${currentCorrectAnswer}`;
                feedback.style.color = "#e74c3c";
                
                // Hiển thị màu xanh cho đáp án đúng
                allButtons.forEach(btn => {
                    if(btn.innerText === currentCorrectAnswer) {
                        btn.style.background = "#2ecc71";
                        btn.style.color = "white";
                    }
                });
            }
            document.getElementById('next-quiz-btn').style.display = "block";
        }

        // Khởi tạo app
        updateFlashcard();
    </script>
</body>
</html>
